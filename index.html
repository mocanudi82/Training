<style>
:root{
  --bg:#f6f8f7; --bg0:#f6f8f7; --dm:11%; --card:#ffffff; --ink:#0d1b2a; --muted:#4f6b73; --line:#d3dcdb; --shadow:#dbe3e2;
  --accent:#ff6f3c; --accent-t:#c2430f; --accent-ink:#0d1b2a; --accent-soft:#fbd9c9;
  --ok:#3f6f6f; --ok-soft:#d9e6e1; --warn:#7a5a00; --warn-soft:#f8e7a8; --bad:#b8381f; --bad-soft:#f8d5ca;
  --chip:#e8eeed; --s1:#0d1b2a; --s2:#ff6f3c; --s3:#f2b705; --s4:#5d8a8a;
  --fm:"Space Mono",ui-monospace,Menlo,Consolas,monospace; --fb:"Souliyo Unicode","Raleway","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d3752; --bg0:#1d3752; --dm:20%; --card:#294a68; --ink:#f4eedc; --muted:#b4cccc; --line:#41627f; --shadow:#142a3f;
  --accent:#ff6f3c; --accent-t:#ff8f63; --accent-ink:#0d1b2a; --accent-soft:#4a2a22;
  --ok:#7fb5b5; --ok-soft:#1f4547; --warn:#f2b705; --warn-soft:#4a3b0a; --bad:#ff8f7a; --bad-soft:#5a2a22;
  --chip:#365a7c; --s1:#f2ebd7; --s2:#ff6f3c; --s3:#f2b705; --s4:#5d8a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d3752; --bg0:#1d3752; --dm:20%; --card:#294a68; --ink:#f4eedc; --muted:#b4cccc; --line:#41627f; --shadow:#142a3f;
  --accent:#ff6f3c; --accent-t:#ff8f63; --accent-ink:#0d1b2a; --accent-soft:#4a2a22;
  --ok:#7fb5b5; --ok-soft:#1f4547; --warn:#f2b705; --warn-soft:#4a3b0a; --bad:#ff8f7a; --bad-soft:#5a2a22;
  --chip:#365a7c; --s1:#f2ebd7; --s2:#ff6f3c; --s3:#f2b705; --s4:#5d8a8a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--fb);
  margin:0;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.row{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;letter-spacing:.2px;text-wrap:balance}
.sp{flex:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:18px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:64px;padding:7px 10px;border-radius:12px;background:var(--chip);text-align:center;line-height:1.15;border:2px solid transparent}
.wk b{display:block;font-size:15px}.wk span{font-size:11px;color:var(--muted)}
.wk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.wk.on span{color:var(--accent-ink);opacity:.85}
.tabs{display:flex;gap:6px;padding-top:8px}
.tab{flex:1;padding:8px 4px;border-radius:10px;background:var(--chip);text-align:center;font-weight:600;font-size:14px;line-height:1.15}
.tab small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--bg)}.tab.on small{color:var(--bg);opacity:.75}
.bar{height:5px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 4px}
.muted{color:var(--muted)}.small{font-size:13px}
.sess-title{margin:14px 0 2px;font-size:17px;font-weight:700;text-wrap:balance}
.sess-meta{font-size:13px;color:var(--muted)}
.opt{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
.pain{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pain button{width:36px;height:34px;border-radius:9px;background:var(--chip);font-weight:600}
.pain button.on{background:var(--ok);color:var(--bg)}.pain button.on.mid{background:var(--warn)}.pain button.on.hi{background:var(--bad)}
.blk{border-left:5px solid var(--bc);background:color-mix(in srgb,var(--bc) 15%,transparent);border-radius:0 14px 14px 0;padding:2px 0 4px 8px;margin:14px 0 0}
.blk .sec{margin:8px 0 4px;color:color-mix(in srgb,var(--bc) 70%,var(--ink))}
.swlist{flex:1 1 100%;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:2px 0 6px}
.swh{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px;position:sticky;top:0;background:var(--card)}
.swit{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;font:inherit}
.swit.on{background:var(--accent-soft);font-weight:700}
.sec{margin:18px 0 4px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.sec .cnt{margin-left:auto;font-weight:600;letter-spacing:0}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0}
.ex.done{opacity:.6}
.ex .h{display:flex;gap:8px;align-items:flex-start}
.num{flex:0 0 auto;min-width:24px;height:24px;border-radius:8px;background:var(--chip);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.ex .nm{font-weight:650;line-height:1.25}
.ex .std{font-size:13px;color:var(--muted);margin-top:1px}

.com/results?search_query=high+knees+running+drill+tutorial+"},{"t":"ex","id":"TH-97","n":"5","name":"Butt Kicks","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Quick cadence, heels kicking up toward the glutes, minimal forward lean. Tip: Hamstring/quad cycling speed — complements the A/B skip pair.","video":"https://www.youtube.com/results?search_query=butt+kicks+running+drill+tutorial+"},{"t":"sec","text":"MAIN SET — THRESHOLD"},{"t":"ex","id":"TH-99","n":"6","name":"Continuous Tempo Run","unit":"Run: 163-176 bpm  |  Bike: 156-169 bpm","rest":"—","tempo":null,"w":[{"s":"20-30 min","kg":null}],"kind":"THR","focus":null,"note":"Run at a pace you could sustain for about an hour if you had to — hard but controlled, not a race effort. Tip: This raises the pace you can hold before lactate accumulates.","video":"https://www.youtube.com/results?search_query=tempo+run+pacing+guide+"},{"t":"ex","id":"TH-100","n":"7","name":"Sweet Spot Bike (alternative)","unit":"Bike: 156-169 bpm or RPE 6-7/10","rest":"—","tempo":null,"w":[{"s":"20-30 min","kg":null}],"kind":"THR","focus":null,"note":"Steady, hard-but-sustainable effort — you could speak in short sentences, not full ones. Tip: Bike sweet-spot work is a very time-efficient threshold stimulus with low joint impact.","video":"https://www.youtube.com/results?search_query=sweet+spot+training+cycling+explained+"},{"t":"sec","text":"STRIDES + COOL-DOWN (8 min)"},{"t":"ex","id":"TH-102","n":"8","name":"Strides","unit":"~90-95% top speed","rest":"full walk-back","tempo":null,"w":[{"s":"6 × 100m","kg":null}],"kind":"DRL","focus":null,"note":"Gradual acceleration over the first 30m, hold near-top speed for the middle, relax off the last 20m. Tip: Not a conditioning tool — neuromuscular speed and mechanics work.","video":"https://www.youtube.com/results?search_query=running+strides+technique+tutorial+"},{"t":"ex","id":"TH-103","n":"9","name":"Easy Walk","unit":"Below 157 bpm","rest":"—","tempo":null,"w":[{"s":"3-5 min","kg":null}],"kind":"REC","focus":null,"note":"Walk it out, let heart rate settle before finishing. Tip: Closes out the session and starts the recovery clock for tomorrow.","video":"https://www.youtube.com/results?search_query=cardio+cool+down+routine+"}]},{"id":"SW","tab":"Swim","pre":"Day 4 · ","heading":"Swimming","meta":"OPTIONAL, or in place of the Saturday Zone 2 session · 40-50 min","opt":true,"items":[{"t":"sec","text":"Zero impact. Use it on a week where the legs are beaten up, or simply when you would rather swim."},{"t":"sec","text":"WARM-UP (8-10 min)"},{"t":"ex","id":"SW-109","n":"1","name":"Easy freestyle","unit":"RPE 2-3","rest":"—","tempo":null,"w":[{"s":"200-300 m","kg":null}],"kind":"AER","focus":null,"note":"Relaxed front crawl, breathing every 3 strokes. Stop and reset if the stroke falls apart. Tip: Swimming HR runs roughly 10-13 bpm lower than running at the same effort — judge by breathing, not the watch.","video":"https://www.youtube.com/results?search_query=freestyle+swimming+warm+up+"},{"t":"ex","id":"SW-110","n":"2","name":"Drill set — catch-up & single-arm","unit":"RPE 3","rest":"20 s","tempo":null,"w":[{"s":"4 × 50 m","kg":null}],"kind":"DRL","focus":null,"note":"50 m catch-up drill, 50 m single-arm left, 50 m single-arm right, 50 m fingertip drag. Tip: Technique is the limiter in swimming far more than fitness.","video":"https://www.youtube.com/results?search_query=freestyle+catch+up+drill+single+arm+"},{"t":"sec","text":"MAIN SET — pick ONE"},{"t":"ex","id":"SW-112","n":"3","name":"Continuous aerobic swim","unit":"Run-equivalent Zone 2 minus ~10 bpm  ·  RPE 3-4","rest":"—","tempo":null,"w":[{"s":"20-30 min","kg":null}],"kind":"AER","focus":null,"note":"Steady front crawl, unbroken. Count strokes per length and try to hold the number as you tire. Tip: The straight aerobic option. Rising stroke count means form is degrading.","video":"https://www.youtube.com/results?search_query=continuous+freestyle+swim+aerobic+"},{"t":"ex","id":"SW-113","n":"4","name":"Threshold intervals","unit":"RPE 6-7","rest":"20-30 s","tempo":null,"w":[{"s":"8-10 × 100 m","kg":null}],"kind":"THR","focus":null,"note":"100 m at a hard-but-repeatable pace, 20-30 s rest on the wall. Every rep within 2-3 s of the first. Tip: The swim equivalent of the tempo run.","video":"https://www.youtube.com/results?search_query=swimming+100m+threshold+interval+set+"},{"t":"ex","id":"SW-114","n":"5","name":"Short speed intervals","unit":"RPE 8-9","rest":"30 s","tempo":null,"w":[{"s":"12-16 × 50 m","kg":null}],"kind":"VO2","focus":null,"note":"50 m fast, 30 s rest. Hold technique at speed — stop the set when the stroke breaks down. Tip: Use only if you skipped the Thursday VO2max session.","video":"https://www.youtube.com/results?search_query=swimming+50m+sprint+interval+set+"},{"t":"ex","id":"SW-115","n":"6","name":"Pull-buoy set (upper body bias)","unit":"RPE 4-5","rest":"20 s","tempo":null,"w":[{"s":"6 × 100 m","kg":null}],"kind":"AER","focus":null,"note":"Pull buoy between the thighs, no kick. Optional paddles. Front crawl only. Tip: Legs float and switch off, so this spares them entirely — the best option in a heavy leg week.","video":"https://www.youtube.com/results?search_query=swimming+pull+buoy+set+technique+"},{"t":"sec","text":"COOL-DOWN (5 min)"},{"t":"ex","id":"SW-117","n":"7","name":"Easy backstroke / breaststroke","unit":"RPE 2","rest":"—","tempo":null,"w":[{"s":"200 m","kg":null}],"kind":"REC","focus":null,"note":"Change stroke to unload the shoulders, breathe easily, let the heart rate settle. Tip: Switching stroke takes the shoulders out of the repeated crawl pattern.","video":"https://www.youtube.com/results?search_query=backstroke+cool+down+swimming+"},{"t":"ex","id":"SW-118","n":"8","name":"Shoulder & lat stretch","unit":"—","rest":"—","tempo":null,"w":[{"s":"3-4 min","kg":null}],"kind":"MOB","focus":null,"note":"Doorway pec stretch and an overhead lat stretch, 30 s each side, poolside or at home. Tip: Front crawl is a lot of internal rotation.","video":"https://www.youtube.com/results?search_query=shoulder+lat+stretch+after+swimming+"}]}],"info":[{"title":"Your numbers","rows":[["Max HR","189 bpm"],["Resting HR","58 bpm"],["Method","Karvonen (HRR)"]]},{"title":"Heart-rate zones (bpm)","head":["","Run","Bike"],"rows":[["Zone 2 (Aerobic Base)","137–150","130–143"],["Threshold / Tempo","163–176","156–169"],["VO2max Intervals","176–189","169–182"]]}],"version":"1"},"protocol":{"id":"protocol","name":"Protocol","short":"PRO","tag":"the year at a glance","knee":false,"info_only":true,"weeks":[{"label":"W"}],"sessions":[],"blocks":[{"title":"Two-week cycle","kind":"cards","head":["Week","Monday","Tuesday","Wednesday","Thursday","Friday","Sat / Sun"],"rows":[["WEEK A","Strength A","Cardio — Threshold","Strength B","Cardio — VO2max","Strength C","Cardio — Zone 2 / (OPTIONAL — or a swim)"],["WEEK B","Athletic A","Cardio — Threshold","Athletic B","Cardio — VO2max","Athletic C","Cardio — Zone 2 / (OPTIONAL — or a swim)"],["SKI TRAINING","Ski Day 1 / landing + heavy lower + lactate","Cardio — Zone 2","Ski Day 2 / landing + single-leg + blasters + chassis","Cardio — VO2max","Ski Day 3 / lateral + lactate (TJT) + isometric","Ski Day 4 — optional / blasters + bench + circuit"],["CONDITIONING","Conditioning 1 / lower + complex + metcon","Cardio — Threshold","Conditioning 2 / upper + AMRAP metcon","Cardio — VO2max","Conditioning 3 / bodyweight + EMOM + finisher","Cardio — Zone 2 / (OPTIONAL — or a swim)"],["ATHLETIC 3+3 / (16 weeks)","Athletic 3+3 — A / D / power + squat or hinge + core","Cardio — Zone 2","Athletic 3+3 — B / E / power + pull + core","Cardio — VO2max","Athletic 3+3 — C / F / power + push + core","Rest or easy Zone 2 / (3 lifting days a week)"]]},{"title":"Every day","kind":"lines","rows":[["Morning","10-12 min dynamic routine","Mobility sheet, Section 2. Non-negotiable — it also covers your daily ankle and hip work."],["Before every lift","The primer for that session","The WARM-UP block at the top of each session on the training sheet — different for every workout."],["Evening","15-20 min static routine","Mobility sheet, Section 3. Where all the long holds belong — lead with whatever you trained that day."]]},{"title":"The training year","kind":"cards","head":["Period","What you run","","Why","","Sheet"],"rows":[["January","Ski trip 2. Morning and evening mobility only. Between the two trips (late Dec to the trip): 2 light sessions a week from Ski Training (Day 1 and Day 3) and 2 cardio sessions.","","The December Ski Training block already prepares both trips because they are only weeks apart, so no second block is needed.","","Ski Training · Mobility"],["Week after trip 2","Easy week: 2 light sessions, walking, mobility","","Transition into the big block. Legs back to normal before heavy lifting.","","Mobility"],["Late January — mid May / (16 weeks)","Athletic 3+3 — 3 lifting days a week: A B C in week 1 of each rotation, D E F in week 2. Cardio on Tuesday and Thursday.","","Your main block: power, a heavy lift, size work, knee and hamstring care and core in every session. The first rotation is the gentle start; R4 and R8 are lighter.","","Athletic 3+3 · Cardio & VO2"],["Mid May — end July / (about 11 weeks)","Strength A/B/C ⇄ Athletic A/B/C, alternating weekly, with Cardio & VO2 3× a week","","Size and strength after the athletic block. Set working weights from your Athletic 3+3 numbers.","","Strength ABC · Athletic ABC · Cardio & VO2"],["August / (summer)","2 sessions a week, or Conditioning for 2-3 weeks while travelling; cardio as the holiday allows","","Your recovery window. Do what the holiday allows and keep the knee drills.","","Conditioning"],["September — mid October","Strength A/B/C ⇄ Athletic A/B/C, alternating weekly, with Cardio & VO2 3× a week","","Last build before ski preparation.","","Strength ABC · Athletic ABC · Cardio & VO2"],["Mid October — early December / (8 weeks)","Ski Training — 3 core sessions a week plus 1 optional, PLUS 2 cardio sessions","","REPLACES both A/B/C sheets. Heavy lower and upper days inside the plan protect your strength; knee rules apply (pain-free range only). Use the 5-week version if you start late.","","Ski Training · Cardio & VO2"],["December","Ski trip 1. Morning and evening mobility only. Then straight into the between-trips sessions and trip 2 in January.","","You are there to ski. Week 8 of the ski plan tapers you into it.","","Mobility"]]},{"title":"Ski plan dates","kind":"lines","rows":[["Ski trip 1 — first day","12 Dec 2026",null],["Ski block starts — Week 1","19 Oct 2026","Always a Monday. Last A/B/C week ends. Day 1: first TJT test and symmetry check — record both in the ski cockpit."],["Week 4 — mid-plan re-test","9 Nov 2026","Monday of week 4: second TJT test and symmetry check re-baseline weeks 4-6."],["Week 7 — peak week + final test","30 Nov 2026","Monday of week 7: third TJT test and symmetry check. The hardest week of the block."],["Week 8 — taper begins","7 Dec 2026","Trip on a Friday, Saturday or Sunday: the taper is the trip week itself. Trip Monday to Thursday: the taper is the week before."],["Last session","10 Dec 2026","Two days before the trip at the latest. If the taper week is short, fit its sessions into the days available; skip Day 4."],["First ski day","12 Dec 2026","Arrive fresh rather than marginally fitter and fatigued."]]},{"title":"Rules that keep it honest","kind":"lines","rows":[["Never stack blocks","","The ski plan replaces the A/B/C sheets and the cardio plan. It is not run in addition to them."],["Weighted pull-ups every week","","They appear in Strength Workout A and Athletic Workout C, so the lift is trained on both weeks of the cycle."],["Deloads line up","","One planned deload per 16-week cycle: Strength W5 (calendar week 9). Athletic W5 holds its W4 loads. Cut cardio interval volume by half in the Strength W5 week too."],["Hard cardio away from heavy legs","","Cardio Day 2 (VO2max) is the only genuinely hard cardio session — keep it off your heaviest lower-body day."],["Retest before re-setting loads","","After any break or the ski block, retest key lifts rather than assuming the old working weights still apply."],["Mobility is not optional","","It is the one thing that runs every single day of the year, in every block."],["Conditioning swap","","In the Strength W5 deload week, you may swap the Thursday VO2max cardio session for a Conditioning session — lifting volume is already reduced that week, so it is a good slot to add variety without extra fatigue."]]}],"version":"1"},"mobility":{"id":"mobility","name":"Mobility","short":"MOB","tag":"daily · optional","knee":false,"single":true,"weeks":[{"label":"W"}],"version":"1","sessions":[{"id":"AM","tab":"Morning","pre":"","heading":"Morning routine","meta":"10-12 min · dynamic, no long holds","opt":false,"items":[{"t":"ex","id":"AM-12","n":"1","name":"Cat–cow","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"8-10 slow","kg":null}],"kind":"Mobility","focus":null,"note":"On all fours, alternate rounding and arching the back in time with your breathing. Why: Gently mobilises the spine without loading fresh, fluid-filled discs.","video":"https://www.youtube.com/results?search_query=Cat+cow+exercise+technique"},{"t":"ex","id":"AM-13","n":"2","name":"Thoracic open-book","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"6 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Side-lying, knees stacked and bent, arms out in front. Open the top arm across and follow it with your eyes. Why: Restores overnight mid-back and rib stiffness.","video":"https://www.youtube.com/results?search_query=Thoracic+open-book+exercise+technique"},{"t":"ex","id":"AM-14","n":"3","name":"Glute bridge","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"10-12","kg":null}],"kind":"Strength","focus":null,"note":"Feet flat, drive through the heels, squeeze hard at the top for a second. Why: Wakes the glutes before they spend the day switched off.","video":"https://www.youtube.com/results?search_query=Glute+bridge+exercise+technique"},{"t":"ex","id":"AM-15","n":"4","name":"Dead bug","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"6 / side","kg":null}],"kind":"Strength","focus":null,"note":"Lower back gently pressed into the floor, lower the opposite arm and leg slowly. Why: Core switched on without any spinal flexion.","video":"https://www.youtube.com/results?search_query=Dead+bug+exercise+technique"},{"t":"ex","id":"AM-16","n":"5","name":"Hip CARs","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"3 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Standing, slow controlled hip circles with the pelvis kept still. Why: Full hip range claimed before the day shortens it.","video":"https://www.youtube.com/results?search_query=Hip+CARs+exercise+technique"},{"t":"ex","id":"AM-17","n":"6","name":"World's greatest stretch","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"3 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Long lunge, same-side elbow down towards the instep, then rotate the other arm to the ceiling. Why: Hips, mid-back and hamstrings in a single movement.","video":"https://www.youtube.com/results?search_query=World%27s+greatest+stretch+exercise+technique"},{"t":"ex","id":"AM-18","n":"7","name":"90-90 Hip Switches","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"2×8 slow","kg":null}],"kind":"Mobility","focus":null,"note":"Sit in 90-90, rotate to the opposite 90-90 without hands, slow and controlled. Why: Hip internal/external rotation under control. Responds to daily consistency more than any other single drill. This IS the Section 4 daily dose — do not do it twice.","video":"https://www.youtube.com/results?search_query=90-90+Hip+Switches+exercise+technique"},{"t":"ex","id":"AM-19","n":"8","name":"Ankle Knee-to-Wall","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"2×10 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Foot pointing at wall, heel down, drive the knee forward to touch. Move foot back to your limit. Why: Restores dorsiflexion — a hard limiter on squat depth and landings. Measure toe-to-wall monthly. This IS the Section 4 daily dose — do not do it twice.","video":"https://www.youtube.com/results?search_query=Ankle+Knee-to-Wall+exercise+technique"},{"t":"ex","id":"AM-20","n":"9","name":"Cossack squat","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"5-8 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Wide stance, shift onto one bent leg with the other straight, then shift across. Heel down. Why: Loaded lateral hip and adductor range — the frontal plane the rest of the week barely touches. Direct ski carry-over. Tip: Heel down, torso tall. Sink a little deeper each week.","video":"https://www.youtube.com/results?search_query=Cossack+squat+exercise+technique"},{"t":"ex","id":"AM-21","n":"10","name":"90/90 with lift-off","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"2×8 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Sit in 90-90. Keeping the chest tall, lift the front shin a few cm off the floor and hold briefly. Why: Turns the passive 90-90 range into actively controlled range. Active beats passive for keeping range. Tip: Pairs directly with the switches above — passive range, then active control of it.","video":"https://www.youtube.com/results?search_query=90/90+with+lift-off+exercise+technique"}]},{"id":"PM","tab":"Evening","pre":"","heading":"Evening routine","meta":"15-20 min · static, long holds","opt":false,"items":[{"t":"ex","id":"PM-26","n":"1","name":"Couch stretch","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60-90 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Back foot up on a bench or against a wall. Squeeze the glute and tuck the tailbone before you come upright. Why: Undoes the day's single biggest shortening. Tip: The longest-standing tightness you have. Go to 2×90 s / side on squat days.","video":"https://www.youtube.com/results?search_query=Couch+stretch+exercise+technique"},{"t":"ex","id":"PM-27","n":"2","name":"Supine figure-4","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60-90 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, ankle across the opposite knee, pull that knee towards the chest. Why: Glutes and deep rotators from a low-effort position.","video":"https://www.youtube.com/results?search_query=supine+figure+4+stretch"},{"t":"ex","id":"PM-28","n":"3","name":"Hamstring stretch with a strap","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, strap around the foot, leg raised with a soft knee and the other leg flat. Why: Hamstrings without loading the lower back.","video":"https://www.youtube.com/results?search_query=Hamstring+stretch+with+a+strap+exercise+technique"},{"t":"ex","id":"PM-29","n":"4","name":"90-90 hip static hold","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60-90 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Front leg bent 90° across your body, back leg bent 90° out to the side. Sit tall, then hinge slowly forward over the front leg and hold. Swap sides. Why: Passive end-range hip external rotation (front leg) and internal rotation (back leg) — held long enough to change tissue length, not just access range. Tip: Passive counterpart to the morning switches and lift-offs.","video":"https://www.youtube.com/results?search_query=90+90+hip+stretch"},{"t":"ex","id":"PM-30","n":"5","name":"Child's pose with side reach","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Sit back onto the heels and reach the arms long, then walk them to each side. Why: Lats, flanks and lower-back decompression.","video":"https://www.youtube.com/results?search_query=Child%27s+pose+with+side+reach+exercise+technique"},{"t":"ex","id":"PM-31","n":"6","name":"Supine spinal twist","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, drop both bent knees to one side while the shoulders stay down. Why: Releases mid-back and lower-back tension.","video":"https://www.youtube.com/results?search_query=Supine+spinal+twist+exercise+technique"},{"t":"ex","id":"PM-32","n":"7","name":"Deep Squat Hold","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60s","kg":null}],"kind":"Mobility","focus":null,"note":"Sink into the deepest squat you can hold, heels down, elbows inside knees pushing out, breathe deeply. Why: Loaded end-range hip and ankle position — changes squat depth over 4-6 weeks better than passive stretching. The position both skiing and lifting borrow from. Tip: Also worth 45 s as part of a pre-training warm-up on the training sheet.","video":"https://www.youtube.com/results?search_query=Deep+Squat+Hold+exercise+technique"},{"t":"ex","id":"PM-33","n":"8","name":"Frog rock","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"90 s","kg":null}],"kind":"Mobility","focus":null,"note":"Knees wide on all fours, rock the hips slowly back and forth. Why: Adductors — loaded by Cossack squats, lateral lunges and the Copenhagen plank, and not covered by anything else here. Tip: Lead with this after a squat or lateral day.","video":"https://www.youtube.com/results?search_query=frog+rocks+adductor+mobility"},{"t":"ex","id":"PM-34","n":"9","name":"Thoracic extension over a roller","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45 s","kg":null}],"kind":"Mobility","focus":null,"note":"Roller across the mid-back, support the head, extend back over it, move up 2 cm and repeat. Why: Mid-back extension, stiffened by both pressing and heavy rowing. Tip: Lead with this after an upper or pressing day.","video":"https://www.youtube.com/results?search_query=Thoracic+extension+over+a+roller+exercise+technique"},{"t":"ex","id":"PM-35","n":"10","name":"Doorway pec stretch","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"30 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Forearm on a door frame, elbow at shoulder height, step through and rotate away. Why: Chest and front shoulder, so the shoulder blades can sit back where they belong. Tip: Especially after bench and pressing days.","video":"https://www.youtube.com/results?search_query=Doorway+pec+stretch+exercise+technique"},{"t":"ex","id":"PM-36","n":"11","name":"Forearm and wrist stretch","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"30 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Arm straight, palm down, gently draw the fingers back; then repeat with the palm up. Why: Grip and forearms after carries, dead hangs and heavy pulling. Nothing else on the sheet addresses this. Tip: After carries, dead hangs and heavy pulling.","video":"https://www.youtube.com/results?search_query=Forearm+and+wrist+stretch+exercise+technique"},{"t":"ex","id":"PM-37","n":"12","name":"Short-foot + big-toe stance — one leg (arch)","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"2×30 s / side","kg":null}],"kind":"Strength","focus":null,"note":"Barefoot, on one leg, foot flat, knee soft. Short foot: pull the ball of the foot towards the heel to dome the arch without curling the toes. Then press the big toe down and lift the other four toes (tripod foot: big toe, little toe, heel). Hold. Weaker foot first. Done at home after training, not in the session. Why: Keeps the arch up so the right knee tracks over the 2nd toe instead of caving in. Moved here from the warm-ups of the Ski 5-Week sheet to keep those sessions under 80 min.","video":null}]},{"id":"KN","tab":"Knee & feet","pre":"","heading":"Knee and out-toeing","meta":"2-3× a week · corrective drills","opt":false,"items":[{"t":"ex","id":"KN-42","n":"1","name":"Knee-to-wall ankle mobilisation","unit":"Daily","rest":null,"tempo":null,"w":[{"s":"2×10 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Same position as the test. Drive the knee forward over the toes, heel glued down, then release. Move in and out of the range rather than holding. Why: Restores dorsiflexion so the foot no longer needs to splay to find depth. Tip: Baseline R 7 / L 8 cm (18 Oct 2026). Target +1-2 cm in 4 weeks; move the foot back about 0.5 cm per week. Same dose as the morning routine (Section 2), done once, in the morning.","video":"https://www.youtube.com/results?search_query=Knee-to-wall+ankle+mobilisation+exercise+technique"},{"t":"ex","id":"KN-43","n":"2","name":"Soleus stretch (bent knee)","unit":"Daily","rest":null,"tempo":null,"w":[{"s":"2×45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Staggered stance against a wall, back heel down and back knee BENT. Sink until you feel the deep calf. Why: Deep calf — the usual dorsiflexion restrictor. Under 60 s so it never blunts training. Tip: Higher priority than the gastrocnemius.","video":"https://www.youtube.com/results?search_query=Soleus+stretch+exercise+technique"},{"t":"ex","id":"KN-44","n":"3","name":"Gastrocnemius stretch (straight knee)","unit":"Daily","rest":null,"tempo":null,"w":[{"s":"2×45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Same wall stance but the back leg stays straight. Why: Superficial calf. Pairs with the soleus work above. Tip: Lower priority than the soleus; keep it short.","video":"https://www.youtube.com/results?search_query=Gastrocnemius+stretch+exercise+technique"},{"t":"ex","id":"KN-45","n":"4","name":"Hip internal rotation — prone or seated lift-off","unit":"Daily (evening)","rest":null,"tempo":null,"w":[{"s":"2×8 / side","kg":null}],"kind":"Strength","focus":null,"note":"Seated at 90/90 or lying face down with the knee bent to 90°: turn the foot outward so the thigh rotates inward, hold 2 s at the end, lower slowly. Add a light band when it is easy. Why: Active internal rotation of the hip, the movement that turns the toes in and stops the knee collapsing inward when the feet point straight. Tip: Compare both sides with the prone hip rotation check above; the weaker side goes first.","video":"https://www.youtube.com/results?search_query=hip+internal+rotation+lift+off+prone+90+90"},{"t":"ex","id":"KN-46","n":"5","name":"Single-leg chair squat — knee over the 2nd toe","unit":"3× / week","rest":null,"tempo":null,"w":[{"s":"3×6 / side","kg":null}],"kind":"Strength","focus":null,"note":"Stand on one leg in front of a chair or box. Sit back and down for 3 s until you just touch, then stand without pushing off the seat. Knee tracks over the second toe, pelvis level. A hand on a wall or a mini band above the knee helps if the knee caves. Why: Trains single-leg knee control and the hip internal rotators at once, in the stance you actually have. Tip: Pain-free range only, 0-3/10. Use a higher chair if the knee complains.","video":"https://www.youtube.com/results?search_query=single+leg+chair+squat+knee+valgus"},{"t":"ex","id":"KN-47","n":"6","name":"Single-leg stance with big-toe raise","unit":"Daily","rest":null,"tempo":null,"w":[{"s":"3×30 s / side","kg":null}],"kind":"Strength","focus":null,"note":"Stand on one leg, barefoot, foot flat, knee soft. Press the big toe and the ball of the foot down while you lift the other four toes, or lift only the big toe, and keep the arch up. Hold for balance. Why: Activates the big toe and the arch (tripod foot) that control the foot angle and help the knee stay over the toes. Tip: Closer to the old short-foot drill, now on one leg, so the knee and the ankle work together.","video":"https://www.youtube.com/results?search_query=single+leg+stance+big+toe+raise+arch"},{"t":"ex","id":"KN-48","n":"7","name":"Pallof press on one leg — band","unit":"3× / week","rest":null,"tempo":null,"w":[{"s":"3×10 / side","kg":null}],"kind":"Strength","focus":null,"note":"Band at // ---- planner
const addD=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return dsF(d.getFullYear(),d.getMonth(),d.getDate())};
const monOf=ds=>addD(ds,-((new Date(ds+'T12:00:00').getDay()+6)%7));
const BTYPES={athletic:'Athletic 3+3',strength:'Strength',ski:'Ski 5 Week',ski8:'Ski Training 8 Weeks',cond:'Conditioning',summer:'Summer (2 sessions)',easy:'Easy week',trip:'Trip'};
const firstMonY=()=>{const m=monOf(CALY+'-01-01');return m<CALY+'-01-01'?addD(m,7):m};
function planWeeks(){loadCal();const cfg=CAL.cfg||{};const ath0=cfg['ath'+CALY]||addD(firstMonY(),7);
  const trips=CAL.trips.filter(t=>t.kind!=='other').map(t=>Object.assign({},t,{to:t.to||t.from}));
  const ws=[];for(let m=firstMonY();m<=CALY+'-12-31';m=addD(m,7))ws.push(m);
  const T={};
  const ovl=(m,t)=>{let n=0;for(let i=0;i<7;i++){const d=addD(m,i);if(d>=t.from&&d<=t.to)n++}return n};
  const allTrips=CAL.trips.map(t=>Object.assign({},t,{to:t.to||t.from}));
  ws.forEach(m=>{const hit=allTrips.filter(t=>ovl(m,t)>=3);if(hit.length)T[m]={t:'trip',name:hit[0].name||'Trip',maybe:hit[0].maybe}});
  allTrips.forEach(t=>{if(t.kind==='other')return;const days=Math.round((new Date(t.to)-new Date(t.from))/864e5)+1;if(days<3)return;const m=addD(monOf(t.to),7);if(ws.includes(m)&&!T[m])T[m]={t:'easy'}});
  trips.filter(t=>t.kind==='ski').sort((a,b)=>a.from.localeCompare(b.from)).forEach(sk=>{
    const m0=monOf(sk.from);let lim='0000';trips.forEach(t=>{if(t!==sk&&t.to<sk.from){const e=addD(monOf(t.to),14);if(e>lim)lim=e}});
    let st=addD(m0,-28);if(st<lim)st=lim;const lst=[];for(let m=st;m<=m0;m=addD(m,7))if(ws.includes(m)&&!T[m])lst.push(m);
    lst.forEach((m,i)=>{T[m]={t:'ski',k:5-lst.length+i,name:sk.name,short:lst.length<5}})});
  (CAL.blocks||[]).forEach(b=>{const m0=monOf(b.from);for(let i=0;i<(+b.weeks||1);i++){const m=addD(m0,7*i);if(ws.includes(m))T[m]={t:b.type,k:i,manual:true}}});
  let ak=0,sk=0,ck=0;
  ws.forEach(m=>{if(T[m]){return}
    if(m<ath0)T[m]={t:'cond',k:ck++};
    else if(ak<16){T[m]={t:'athletic',k:ak++}}
    else if(m.slice(5,7)==='08')T[m]={t:'summer',k:ck++};
    else T[m]={t:'strength',k:sk++}});
  let run=0;const out=ws.map(m=>{const w=Object.assign({mon:m},T[m]);if(w.t==='trip'||w.t==='easy')run++;else{if(run>=3)w.retest=true;run=0}if(w.t==='strength'&&(w.k||0)%8===4)w.deload=true;return w});return out}
function weekSess(w){const k=w.k||0;
  if(w.t==='athletic'){const o=k%2?['D','E','F']:['A','B','C'],r=Math.floor(k/2);return [[0,'athletic',o[0],r],[2,'athletic',o[1],r],[4,'athletic',o[2],r],[1,'cardio','Z2',0],[3,'cardio','VO2',0]]}
  if(w.t==='strength'){const r=k%8;return [[0,'strength','A',r],[2,'strength','B',r],[4,'strength','C',r],[1,'cardio','TH',0],[3,'cardio','VO2',0]]}
  if(w.t==='ski'||w.t==='ski8'){const p=w.t,kk=Math.min(k,PROGS[p].weeks.length-1);return [[0,p,'D1',kk],[2,p,'D2',kk],[4,p,'D3',kk],[1,'cardio','Z2',0],[3,'cardio','VO2',0]]}
  if(w.t==='cond'){const r=k%11;return [[0,'conditioning','S1',r],[2,'conditioning','S2',r],[4,'conditioning','S3',r],[1,'cardio','TH',0],[3,'cardio','VO2',0]]}
  if(w.t==='summer'){const r=k%11;return [[0,'conditioning','S1',r],[4,'conditioning','S3',r]]}
  if(w.t==='easy')return [[1,'cardio','Z2',0],[3,'cardio','SW',0]];
  return []}
function loggedIn(p,wi,sid,mon){const st=getState(p),P=PROGS[p],k=wi+'|'+sid;let hit=false;
  Object.entries(st.days||{}).forEach(([d,L])=>{if(L[k]&&L[k].done>0&&(!P.single||(d>=mon&&d<=addD(mon,6))))hit=true});
  const h=st.hist&&st.hist[k];if(!hit&&h&&h.done>0&&h.date&&(!P.single||(h.date>=mon&&h.date<=addD(mon,6))))hit=true;return hit}
let PLANC=null;
function planItems(){loadCal();const cache=JSON.stringify([CALY,CAL.trips,CAL.blocks,CAL.cfg,CAL.moves,CAL.skip]);if(PLANC&&PLANC.k===cache)return PLANC.v;
  const out={},weeks=planWeeks();

    const date=(CAL.moves||{})[key]||addD(w.mon,dow);if(tripsOn(date).some(t=>t.kind!=='other'))return;
    (out[date]=out[date]||[]).push({key,p,sid,wi,mon:w.mon,label:sessLabel(PROGS[p],wi,sid)+((w.deload&&p==='cardio')?' · half volume':''),name:PROGS[p].name,done:loggedIn(p,wi,sid,w.mon),block:w.t})}));
  PLANC={k:cache,v:out,weeks};return out}
function planNow(){loadCal();planItems();const m=monOf(localToday());const w=(PLANC.weeks||[]).find(x=>x.mon===m);return w}
function wkText(w){if(!w)return '';const k=w.k||0;
  if(w.t==='athletic')return 'Athletic 3+3 · R'+(Math.floor(k/2)+1)+' · week '+(k%2+1)+(w.retest?' · retest key lifts first':'');

function planBlocks(){planItems();const out=[];(PLANC.weeks||[]).forEach(w=>{const l=out[out.length-1];if(l&&l.t===w.t&&l.name===w.name&&!w.manual===!l.manual){l.end=addD(w.mon,6);l.k1=w.k}else out.push({t:w.t,name:w.name,manual:w.manual,start:w.mon,end:addD(w.mon,6),k0:w.k,k1:w.k})});

    Object.keys(dm).forEach(k=>{const sp=k.split('|'),wi=+sp[0],sid=sp[1],w=PLAN.weeks[wi];if(!w)return;const h=S.hist[k]||{};
      dm[k].forEach(d=>{const dd=(S.days&&S.days[d]&&S.days[d][k])||{};const sec=dd.dur||h.dur||0,cmn=+(dd.cmin||(S.cmin&&S.cmin[k])||0),min=(id==='cardio'&&cmn)?cmn:(sec?Math.round(sec/60):'');const rd=(CAL.days[d]||{}).r||'';
        const se=PLAN.sessions.find(z=>z.id===sid),di=PLAN.sessions.findIndex(z=>z.id===sid)+1;
        const lab=PLAN.single?((se&&se.tab)||sid):(PLAN.name+' '+w.label+' D'+di);

        const base=[d,PLAN.name,w.label,sessLabel(PLAN,wi,sid)],tail=[min,h.pain==null?'':h.pain,h.notes||'',rd];
        if(h.date===d&&h.items&&h.items.length)h.items.forEach(it=>log.push(base.concat([it.n,it.spec,it.done,it.of,it.kg||''],tail)));
        else log.push(base.concat(['(session total)','',dd.done||'',dd.of||'',''],tail))})})})});

  const trip={};CAL.trips.forEach(t=>{let x=new Date(t.from+'T12:00:00'),e=new Date((t.to||t.from)+'T12:00:00'),n=0;while(x<=e&&n++<120){const ds=dsF(x.getFullYear(),x.getMonth(),x.getDate());trip[ds]=(trip[ds]?trip[ds]+' + ':'')+(t.name||'Trip')+' ('+(t.kind||'trip')+(t.maybe?', maybe':'')+')';x.setDate(x.getDate()+1)}});

    while(x<=e&&n++<900){const d=dsF(x.getFullYear(),x.getMonth(),x.getDate()),en=ent.filter(z=>z.d===d),c=CAL.days[d]||{};
      const tr=en.filter(z=>['ski','ski8','strength','athletic','conditioning'].includes(z.id)),ca=en.filter(z=>z.id==='cardio');
      const mo=[];en.filter(z=>z.id==='mobility').forEach(z=>{if(!mo.includes(z.lab))mo.push(z.lab)});if(c.am&&!mo.includes('Morning'))mo.push('Morning');if(c.pm&&!mo.includes('Evening'))mo.push('Evening');
      const cm=ca.reduce((a,z)=>a+z.min,0);
      days.push([d,WD[x.getDay()],tr.map(z=>z.name).join(' + '),tr.map(z=>z.wd).join(' + '),ca.map(z=>z.lab==='Swim'?'':z.lab).filter(Boolean).join(' + '),ca.map(z=>z.mode).filter(Boolean).join(' + '),cm||'',mo.join(' + '),c.tango?'Yes':'',trip[d]||'',c.r||'',en.reduce((a,z)=>a+z.min,0)||'',c.note||'']);x.setDate(x.getDate()+1)}}
