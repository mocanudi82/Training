<title>Ski Prep 5-Week</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f3f6f9; --card:#ffffff; --ink:#14202b; --muted:#5c6b78; --line:#d9e1e8;
  --accent:#1f6fb2; --accent-ink:#ffffff; --accent-soft:#e1eefa;
  --ok:#2c8a57; --ok-soft:#e1f3e9; --warn:#b3541e; --warn-soft:#fbe9dc; --bad:#b3261e; --bad-soft:#fbe3e1;
  --chip:#eef2f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161e; --card:#162230; --ink:#e8eff5; --muted:#93a4b3; --line:#27394a;
  --accent:#6cb4f0; --accent-ink:#08213a; --accent-soft:#1b3550;
  --ok:#59c58b; --ok-soft:#173a2a; --warn:#f0a06a; --warn-soft:#3d2a1a; --bad:#ff8a80; --bad-soft:#3f1d1b;
  --chip:#1e2e3f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161e; --card:#162230; --ink:#e8eff5; --muted:#93a4b3; --line:#27394a;
  --accent:#6cb4f0; --accent-ink:#08213a; --accent-soft:#1b3550;
  --ok:#59c58b; --ok-soft:#173a2a; --warn:#f0a06a; --warn-soft:#3d2a1a; --bad:#ff8a80; --bad-soft:#3f1d1b;
  --chip:#1e2e3f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  margin:0;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.row{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;letter-spacing:.2px;text-wrap:balance}
.sp{flex:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:18px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:64px;padding:7px 10px;border-radius:12px;background:var(--chip);text-align:center;line-height:1.15;border:2px solid transparent}
.wk b{display:block;font-size:15px}.wk span{font-size:11px;color:var(--muted)}
.wk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.wk.on span{color:var(--accent-ink);opacity:.85}
.tabs{display:flex;gap:6px;padding-top:8px}
.tab{flex:1;padding:8px 4px;border-radius:10px;background:var(--chip);text-align:center;font-weight:600;font-size:14px;line-height:1.15}
.tab small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--bg)}.tab.on small{color:var(--bg);opacity:.75}
.bar{height:5px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 4px}
.muted{color:var(--muted)}.small{font-size:13px}
.sess-title{margin:14px 0 2px;font-size:17px;font-weight:700;text-wrap:balance}
.sess-meta{font-size:13px;color:var(--muted)}
.opt{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
.pain{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pain button{width:36px;height:34px;border-radius:9px;background:var(--chip);font-weight:600}
.pain button.on{background:var(--ok);color:#fff}.pain button.on.mid{background:var(--warn)}.pain button.on.hi{background:var(--bad)}
.sec{margin:18px 0 4px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.sec .cnt{margin-left:auto;font-weight:600;letter-spacing:0}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0}
.ex.done{opacity:.6}
.ex .h{display:flex;gap:8px;align-items:flex-start}
.num{flex:0 0 auto;min-width:24px;height:24px;border-radius:8px;background:var(--chip);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.ex .nm{font-weight:650;line-height:1.25}
.ex .std{font-size:13px;color:var(--muted);margin-top:1px}
.low{display:inline-block;margin-top:4px;font-size:12.5px;padding:2px 8px;border-radius:8px;background:var(--chip);color:var(--muted)}
.low.hot{background:var(--warn-soft);color:var(--warn);font-weight:700}
.skip{display:inline-block;margin:4px 0 0 6px;font-size:12.5px;padding:2px 8px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:700}
.spec{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px}
.spec b{font-size:17px}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;align-items:center}
.set{width:44px;height:44px;border-radius:12px;background:var(--chip);font-weight:700;color:var(--muted);border:2px solid transparent}
.set.on{background:var(--ok);color:#fff}
.kg{width:86px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;text-align:center;margin-left:auto}
.kg::placeholder{color:var(--muted)}
.links{display:flex;gap:14px;margin-top:8px;font-size:13.5px}
.links button,.links a{color:var(--accent);text-decoration:none;font-weight:600}
.note{margin-top:8px;font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:9px 10px}
.tag{font-size:11px;color:var(--muted);margin-top:6px}
.tjt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tjt label{font-size:13px;color:var(--muted)}
.tjt input{width:90px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.emom{font-size:18px;font-weight:700;color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel .in{max-width:720px;margin:0 auto}
.btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;margin:6px 8px 0 0}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.bad{background:var(--bad-soft);color:var(--bad)}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.wkcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0;font-size:14px}.wkcard dt{color:var(--muted)}.wkcard dd{margin:0}

.pbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.pbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:4px}
.pbar label{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px;line-height:1.1;text-align:center}
.pbar button{flex:1;min-width:0;height:38px;border-radius:9px;background:var(--chip);font-weight:700;font-size:14px}
.pbar button.on{background:var(--ok);color:#fff}.pbar button.on.mid{background:var(--warn)}.pbar button.on.hi{background:var(--bad)}
.add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:90px}
.field input,.field textarea{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit;font-size:16px}
.field textarea{height:auto;min-height:70px;padding:8px 10px;font-family:inherit}
.lib{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--card)}
.lib button{display:block;width:100%;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px}
.lib button:last-child{border-bottom:0}
.xbtn{margin-left:auto;color:var(--bad);font-weight:700;padding:4px 8px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <div class="row"><h1>Ski Prep · 5 weeks</h1><span class="sp"></span>
      <button class="iconbtn" id="btnWeek" aria-label="Week overview" title="Week overview">≡</button>
      <button class="iconbtn" id="btnSet" aria-label="Settings" title="Settings">⚙</button></div>
    <div class="scroller" id="weeks"></div>
    <div class="tabs" id="tabs"></div>
    <div class="bar"><i id="prog"></i></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<div class="pbar"><div class="in" id="pbar"></div></div>
<div class="sheet" id="sheetAdd"><div class="panel"><div class="in" id="addPanel"></div></div></div>
<div class="sheet" id="sheetWeek"><div class="panel"><div class="in" id="weekPanel"></div></div></div>
<div class="sheet" id="sheetSet"><div class="panel"><div class="in" id="setPanel"></div></div></div>

<script>
const PLAN = {"title":"Ski Prep 5-Week","weeks":[{"label":"W1","phase":"BUILD","date":"2026-11-09","emom":"15 / 20","landing":"2-leg stick","blasters":"8 mini","chassis":"Set A","circuit":"Spect. 5×4"},{"label":"W2","phase":"BUILD","date":"2026-11-16","emom":"20 / 20","landing":"2-leg stick","blasters":"4 full","chassis":"Set A","circuit":"Spect. 5×5"},{"label":"W3","phase":"LOAD","date":"2026-11-23","emom":"20 / 20","landing":"1-leg hop fwd + matrix","blasters":"5 full","chassis":"Set B","circuit":"Renegade 5×5"},{"label":"W4","phase":"PEAK","date":"2026-11-30","emom":"15 / 20","landing":"1-leg hop matrix","blasters":"5 full","chassis":"Set C","circuit":"Toss 4×5"},{"label":"W5","phase":"TAPER · trip","date":"2026-12-07","emom":"10 / 10","landing":"1-leg hop matrix","blasters":"3 mini","chassis":"Set C × 2","circuit":"—"}],"sessions":[{"id":"D1","day":"D1 MON core","heading":"LANDINGS + HEAVY LOWER + LACTATE","meta":"CORE · ~68-78 min (test weeks W1 and W4 included)","opt":false,"items":[{"t":"sec","text":"KNEE & ARCH PREP (kiné block) + RAMP + landing control (~15 min). Weaker leg first on every single-leg drill. Pain rule: 0-3/10 go, above 3 use the low version of every jump, above 5 skip the jumps."},{"t":"ex","id":"D1-35","n":"1","name":"Easy bike (or brisk walk)","unit":"min","rest":"—","tempo":"easy","w":[{"s":"3","kg":null},{"s":"3","kg":null},{"s":"3","kg":null},{"s":"3","kg":null},{"s":"3","kg":null}],"kind":"Pulse-Raiser","focus":"RAMP · Raise","note":"Raises core temperature before anything else. The 'Raise' phase of RAMP.","video":"https://www.youtube.com/results?search_query=easy+jog+warm+up"},{"t":"ex","id":"D1-36","n":"2","name":"Lateral Band Walk — knees out","unit":"reps/side","rest":"—","tempo":"—","w":[{"s":"2×10","kg":"band"},{"s":"2×12","kg":"band"},{"s":"2×12","kg":"band"},{"s":"2×12","kg":"band"},{"s":"1×12","kg":"band"}],"kind":"Lateral Plane","focus":"LA · Glute Medius","note":"Band above the knees, knees pushed out, toes forward, small steps, hips low. The glute medius is what stops the knee caving in.","video":"https://www.youtube.com/results?search_query=lateral+band+walk"},{"t":"ex","id":"D1-37","n":"3","name":"Single-Leg Box Squat — 40 cm | pain>3: 50 cm","unit":"reps/side","rest":"—","tempo":"3-1-1-0","w":[{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"1×10","kg":"BW"}],"kind":"Lower Push","focus":"STR · Knee Control (anti-valgus)","note":"Your kiné exercise. Sit back to a 40 cm box on one leg (pain >3: 50 cm box, less knee bend), 3 s down, light touch, stand without rocking. The knee tracks over the second toe, no cave-in: a mini band above the knee or a hand on a post if it drifts. Weaker leg first. 0-3/10 is fine, above 3 use the higher box.","video":"https://www.youtube.com/results?search_query=single+leg+box+squat+knee+valgus"},{"t":"ex","id":"D1-38","n":"4","name":"Short-Foot + Big-Toe Stance — now in the evening Mobility routine","unit":"s/side","rest":"—","tempo":"hold","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Balance","focus":"LA · Arch & Foot Control","note":"Moved to the evening routine on the Mobility sheet (Section 3), 2×30 s per side, done at home after training.","video":"https://www.youtube.com/results?search_query=short+foot+exercise+big+toe+raise"},{"t":"ex","id":"D1-39","n":"5","name":"Single-Leg Calf Raise — big toe pressed down (arch)","unit":"reps/side","rest":"—","tempo":"2-1-2-0","w":[{"s":"1×10","kg":"BW"},{"s":"1×10","kg":"BW"},{"s":"1×10","kg":"BW"},{"s":"1×10","kg":"BW"},{"s":"—","kg":"BW"}],"kind":"Isolation","focus":"STR · Soleus / Arch","note":"Stand on one leg, rise onto the ball of the foot while pressing the big toe down and keeping the arch up (no rolling out onto the little toe), 2 s up, 1 s hold, 2 s down. Calf strength plus the arch. Replaces the double calf + tibialis set here to keep the session under 80 min; D3 and D4 keep the calf + tibialis raises.","video":"https://www.youtube.com/results?search_query=single+leg+calf+raise+big+toe"},{"t":"ex","id":"D1-40","n":"6","name":"Spanish Squat Hold — band behind the knees","unit":"s","rest":"45 s","tempo":"hold","w":[{"s":"3×45","kg":"band"},{"s":"3×45","kg":"band"},{"s":"3×45","kg":"band"},{"s":"3×45","kg":"band"},{"s":"2×45","kg":"band"}],"kind":"Lower Push","focus":"STR · Patellar Tendon Isometric","note":"Band or strap behind the knees, lean back with the shins vertical, thighs about 60° bent, hold. Your kiné isometric: it loads the tendon without sliding the kneecap and quiets the knee before the jumps. Hold at 0-3/10, stop at 4. Time saver: do the one-leg Pallof press during the 45 s rests between holds.","video":"https://www.youtube.com/results?search_query=spanish+squat+isometric+patellar+tendon"},{"t":"ex","id":"D1-41","n":"7","name":"Eccentric Step-Down — 10 cm | pain>3: 6 cm","unit":"reps/side","rest":"—","tempo":"3-0-1-0","w":[{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"1×10","kg":"BW"}],"kind":"Lower Push","focus":"EC · Quad Eccentric Control (patellar tendon)","note":"Kiné step-down. Stand on a 10 cm step (pain >3: 6 cm, or hold a post), lower the other heel to the floor over 3 s with the knee over the second toe, touch lightly and stand. Go higher only if the knee stays under 3/10.","video":"https://www.youtube.com/results?search_query=eccentric+step+down+patellofemoral"},{"t":"ex","id":"D1-42","n":"8","name":"Single-Leg Balance — eyes closed","unit":"s/side","rest":"—","tempo":"hold","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"2×30","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Balance","focus":"LA · Balance & Proprioception","note":"Eyes closed, same soft ski stance. Touch a rail when you need to; aim for 30 s clean each side.","video":"https://www.youtube.com/results?search_query=single+leg+balance+eyes+closed"},{"t":"ex","id":"D1-43","n":"9","name":"Pallof Press — on one leg (arch)","unit":"reps/side","rest":"—","tempo":"1-2-1-0","w":[{"s":"2×8","kg":"band"},{"s":"2×8","kg":"band"},{"s":"2×10","kg":"band"},{"s":"2×10","kg":"band"},{"s":"2×8","kg":"band"}],"kind":"Rotational","focus":"RP · Anti-Rotation + Arch","note":"Band at chest height, stand on ONE leg with a soft knee, press out and hold 2 s, resist the pull. Hips level, arch up, no knee wobble. Trunk stiffness plus single-leg arch and hip stability in one drill. Weaker leg stands first. Foot slips or the knee drifts in: go back to the split stance.","video":"https://www.youtube.com/results?search_query=single+leg+pallof+press"},{"t":"ex","id":"D1-44","n":"10","name":"Drop Landing — 30 cm | pain>3: 15 cm","unit":"reps","rest":"30 s","tempo":"stick","w":[{"s":"3×5","kg":"BW"},{"s":"3×5","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Landing","focus":"PLY · Landing Mechanics","note":"Step off, land on both feet, stick 2 s: hips back, knees over the 2nd toe, never inside. Quiet feet. Step off a 30 cm box (pain >3: 15 cm), land on both feet, stick 2 s: hips back, knees over the 2nd toe, never inside. Quiet feet. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=drop+landing+technique"},{"t":"ex","id":"D1-45","n":"11","name":"Single-Leg Hop & Stick, forward — 60 cm | pain>3: 40 cm","unit":"reps/side","rest":"30 s","tempo":"stick","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"3×4","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Landing","focus":"PLY · Single-Leg Landing","note":"Hop forward, land on the same leg, stick 2 s. A silent, stable landing matters more than distance. Hop forward 60 cm (pain >3: 40 cm) on one leg, stick 2 s, knee over the 2nd toe. Weaker leg first. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=single+leg+hop+and+stick"},{"t":"ex","id":"D1-46","n":"12","name":"Single-Leg Hop Matrix — 4 squares, 30 cm | pain>3: 20 cm","unit":"s/side","rest":"30 s","tempo":"stick","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"2×20","kg":"BW"},{"s":"2×30","kg":"BW"},{"s":"2×20","kg":"BW"}],"kind":"Landing","focus":"PLY · Multi-Directional Landing","note":"Tape a cross on the floor. On one leg, hop forward, back, out and in across the lines, stick each landing 1 s, knee over the 2nd toe. Standard size 30 cm; pain above 3/10: 20 cm. Landing prep for the jumps, 20-30 s per leg. Weaker leg first. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=single+leg+hop+matrix"},{"t":"ex","id":"D1-47","n":"13","name":"Lateral Skater Bound — 1.0 m | pain>3: 0.6 m","unit":"reps/side","rest":"30 s","tempo":"stick","w":[{"s":"3×4","kg":"BW"},{"s":"3×4","kg":"BW"},{"s":"3×5","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Lateral Plane","focus":"PLY · Frontal-Plane Landing","note":"Push off one leg, land on the other and stick 2 s, knee over the foot. The ski-edge push, loaded. Bound 1.0 m sideways (pain >3: 0.6 m), stick 2 s on the outside leg. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=lateral+skater+bound"},{"t":"ex","id":"D1-48","n":"14","name":"Skater Bound, 3 continuous + stick — 1.0 m | pain>3: 0.6 m","unit":"reps/side","rest":"45 s","tempo":"X","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"3×3","kg":"BW"},{"s":"2×2","kg":"BW"}],"kind":"Lateral Plane","focus":"PLY · Reactive Landing","note":"Three quick bounds side to side, stick the fourth. Short ground contacts, same knee control. Three continuous 1.0 m bounds (pain >3: 0.6 m), then stick the last landing 2 s. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=continuous+skater+bounds"},{"t":"ex","id":"D1-49","n":"15","name":"Box Jump — 40 cm | pain>3: 25 cm","unit":"reps","rest":"30 s","tempo":"X","w":[{"s":"2×5","kg":"BW"},{"s":"2×5","kg":"BW"},{"s":"2×5","kg":"BW"},{"s":"2×5","kg":"BW"},{"s":"2×5","kg":"BW"}],"kind":"Lower Power","focus":"RAMP · Potentiate","note":"The RAMP 'potentiate' step before the heavy lifting. Step down, never jump down. Jump onto a 40 cm box (pain >3: 25 cm), step down, never jump down. Land softly, knees over the 2nd toe. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=box+jump"},{"t":"sec","text":"HEAVY LOWER — before the jumping, while fresh. kg from your Strength A/B/C 1RMs."},{"t":"ex","id":"D1-51","n":"16","name":"Ramp-Up Sets","unit":"reps","rest":"60-90 s","tempo":"—","w":[{"s":"8/5/3","kg":"45–65"},{"s":"8/5/3","kg":"45–65"},{"s":"8/5/3","kg":"45–65"},{"s":"8/5/3","kg":"45–65"},{"s":"8/5/3","kg":"45–65"}],"kind":"Potentiation","focus":"RAMP · Ramp to working load","note":"Empty bar × 8, then about 40% × 5 and 60% × 3 (the kg cell shows the 40-60% range). The working sets are now sets of 6-8, so the ramp stops under them. Warm-up sets: don't log them or push them.","video":"https://www.youtube.com/results?search_query=bench+press+warm+up+sets"},{"t":"ex","id":"D1-52","n":"17","name":"Back Squat","unit":"reps","rest":"2 min","tempo":"3-0-1-0","w":[{"s":"3×8","kg":77.5},{"s":"3×8","kg":80},{"s":"3×6","kg":85},{"s":"3×6","kg":87.5},{"s":"2×6","kg":80}],"kind":"Lower Push","focus":"STR · Maximal Strength","note":"Sets of 6-8 at 70-80% of your squat 1RM: strength with more reps per set than the old fours and threes, which the patellar tendon tolerates better than heavy singles and triples. Slow 3 s lowering. Squat to parallel or just above, pain 0-3/10; if pain is above 3 squat to a box at 90° and take 5-10% off. Leave 2-3 reps in reserve.","video":"https://www.youtube.com/results?search_query=back+squat+technique"},{"t":"ex","id":"D1-53","n":"18","name":"Conventional Deadlift (barbell)","unit":"reps","rest":"2 min","tempo":"2-0-1-0","w":[{"s":"2×5","kg":122.5},{"s":"2×5","kg":125},{"s":"2×4","kg":135},{"s":"2×4","kg":137.5},{"s":"—","kg":null}],"kind":"Lower Hinge","focus":"STR · Maximal Strength","note":"Ramp-up before the working sets: bar × 8, then 1×5 at about 50% and 1×3 at about 65% of your deadlift 1RM (the squat ramp-up row above covers the squat). Replaces the trap bar. Sets of 4-5 at 75-85% of your conventional deadlift 1RM, 2 s down, no bouncing. The hinge is the easiest big lift on the knee, but it is still a heavy day: stop 2-3 reps short of failure, back flat, bar against the legs.","video":"https://www.youtube.com/results?search_query=deadlift+technique"},{"t":"ex","id":"D1-54","n":"19","name":"TJT to Box — 2 min TEST — 35 cm | pain>3: 25 cm","unit":"reps (max)","rest":"5 min after","tempo":"X","w":[{"s":"1×2 min","kg":"max"},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"1×2 min","kg":"max"},{"s":"—","kg":null}],"kind":"Reactive Jump","focus":"PWR · Leg Lactate Test","note":"Weeks 1 and 4, after the squats: touch-jump-touch to the box for 2 minutes, as many clean reps as you can, then 5 min easy rest before the EMOM. Enter the result in the yellow cell at the top (W1 test in the first, W4 retest in the second): it sets every EMOM. Stop the test if the knee goes above 3/10. Pain >3 before you start: use the 25 cm box.","video":"https://mtntactical.com/exercises/touch-jump-touch-box/"},{"t":"ex","id":"D1-55","n":"20","name":"Touch-Jump-Touch to Box — 35 cm | pain>3: 25 cm","unit":"reps × min","rest":"in-minute","tempo":"X","w":[{"s":"? × 15","kg":"BW"},{"s":"? × 20","kg":"BW"},{"s":"? × 20","kg":"BW"},{"s":"? × 15","kg":"BW"},{"s":"? × 10","kg":"BW"}],"kind":"Reactive Jump","focus":"PWR · Leg Lactate Tolerance","note":"Cell = reps every minute × minutes. Reps come from your 2-minute test at the top (25%). Test weeks W1 and W4 run 15 minutes because the test comes first. Finish the reps fast; the rest of the minute is your rest. Miss the target two minutes in a row: drop 1 rep. Box 35 cm (pain >3: 25 cm). Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://mtntactical.com/exercises/touch-jump-touch-box/"},{"t":"sec","text":"INJURY-PROOFING — hamstrings + adductors. Nordics on D1 and D2, standing single-leg curl on D1, slider curl on D2, lying leg curl on D3 and D4: six hamstring hits a week."},{"t":"ex","id":"D1-57","n":"21","name":"Nordic Hamstring Curl (hand-assisted)","unit":"reps","rest":"90 s","tempo":"5-0-X","w":[{"s":"2×4","kg":"BW"},{"s":"3×4","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Isolation","focus":"EC · Hamstring Eccentric Resilience","note":"Lower under control, catch with the hands. Volume starts low because first-week soreness is severe.","video":"https://www.youtube.com/results?search_query=nordic+hamstring+curl+progression"},{"t":"ex","id":"D1-58","n":"22","name":"Nordic Hamstring Curl","unit":"reps","rest":"90 s","tempo":"5-0-X","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"3×5","kg":"BW"},{"s":"3×6","kg":"BW"},{"s":"2×3","kg":"BW"}],"kind":"Isolation","focus":"EC · Hamstring Eccentric Resilience","note":"Less hand help each week; lower as slowly as you can. End the set when the first half is no longer controlled.","video":"https://www.youtube.com/results?search_query=nordic+hamstring+curl+progression"},{"t":"ex","id":"D1-59","n":"23","name":"Copenhagen Adduction — short lever","unit":"reps/side","rest":"60 s","tempo":"2-0-2","w":[{"s":"2×8","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Isolation","focus":"EC · Adductor Resilience","note":"Side plank, top KNEE on a bench, lift the bottom leg to meet it, lower slowly. Cut groin problems 41% in an RCT.","video":"https://www.youtube.com/results?search_query=copenhagen+adduction"},{"t":"ex","id":"D1-60","n":"24","name":"Copenhagen Adduction — long lever","unit":"reps/side","rest":"60 s","tempo":"2-0-2","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"2×8","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×8","kg":"BW"}],"kind":"Isolation","focus":"EC · Adductor Resilience","note":"Top ANKLE on the bench now (long lever) — much harder. Drop back to the knee if the hips sag.","video":"https://www.youtube.com/results?search_query=copenhagen+adduction"},{"t":"ex","id":"D1-61","n":"25","name":"Standing Single-Leg Curl — cable or band","unit":"reps/side","rest":"45 s","tempo":"2-1-2-0","w":[{"s":"2×8","kg":"find"},{"s":"2×8","kg":"find"},{"s":"3×8","kg":"find"},{"s":"3×10","kg":"find"},{"s":"—","kg":null}],"kind":"Isolation","focus":"EC · Hamstring Strength · Left/Right Balance","note":"Ankle cuff on a low cable (or a band anchored low). Stand on the other leg with a soft knee and a hand on the post, curl the heel to the glute in 2 s, hold 1 s, lower for 2 s. Same weight both legs: it shows any side gap, weaker leg first. The Toe Touch Complex it replaces is gone from D1 to make room.","video":"https://www.youtube.com/results?search_query=standing+single+leg+hamstring+curl+cable"},{"t":"sec","text":"D1 FINISH — hip control, trunk and backward sled drag (~10 min). Skipped in the taper week."},{"t":"ex","id":"D1-63","n":"26","name":"Hip Airplane — assisted (hand on a post)","unit":"reps/side","rest":"—","tempo":"slow","w":[{"s":"2×5","kg":"BW"},{"s":"2×5","kg":"BW"},{"s":"2×5","kg":"BW"},{"s":"2×5","kg":"BW"},{"s":"—","kg":"BW"}],"kind":"Mobility","focus":"MOB · Hip Control in the Boot","note":"Hand on a post, balance on one leg, rotate the pelvis open and closed over the standing hip. Teaches the hip to rotate while the knee stays aligned.","video":"https://www.youtube.com/results?search_query=hip+airplane+exercise"},{"t":"ex","id":"D1-64","n":"27","name":"Hollow Body Hold","unit":"s","rest":"—","tempo":"hold","w":[{"s":"2×20","kg":"BW"},{"s":"2×25","kg":"BW"},{"s":"2×30","kg":"BW"},{"s":"2×30","kg":"BW"},{"s":"—","kg":"BW"}],"kind":"Core","focus":"RP · Anti-Extension","note":"On your back, ribs down, lower back pressed into the floor, arms overhead, legs straight 30-45° off the floor. Bend the knees and put the arms by the sides if the back arches. Trunk stiffness against extension, the missing piece on D1 now that the Pallof is in the warm-up.","video":"https://www.youtube.com/results?search_query=hollow+body+hold"},{"t":"ex","id":"D1-65","n":"28","name":"Backward Sled Drag — knee-friendly quads","unit":"m","rest":"60 s","tempo":"steady","w":[{"s":"2×15","kg":"find"},{"s":"3×15","kg":"find"},{"s":"4×20","kg":"find"},{"s":"4×20","kg":"find"},{"s":"—","kg":null}],"kind":"Lower Push","focus":"STR · Quad Endurance · Low Knee Load","note":"Harness or strap on the sled, face the sled and walk backwards in small steps, upright, heels reaching back. Moderate load you can drag at a steady pace; log the plate weight in the kg cell. Loads the quads and the tendon with no knee-bend landing, so it replaces the rucksack step-ups while the knee is sore. Stop the set if the pain goes above 3/10.","video":"https://www.youtube.com/results?search_query=backward+sled+drag+knee"}]},{"id":"D2","day":"D2 WED core","heading":"LANDINGS + SINGLE-LEG STRENGTH + BLASTERS + CHASSIS","meta":"CORE · ~70-80 min (W5 ~35)","opt":false,"items":[{"t":"sec","text":"KNEE & ARCH PREP (kiné block) + RAMP + landing control (~15 min). Weaker leg first on every single-leg drill. Pain rule: 0-3/10 go, above 3 use the low version of every jump, above 5 skip the jumps."},{"t":"ex","id":"D2-71","n":"1","name":"Easy bike (or brisk walk)","unit":"min","rest":"—","tempo":"easy","w" =rear+foot+elevated+split+squat+tempo"},{"t":"sec","text":"ECCENTRIC LEGS — leg blasters, the most ski-specific work in the plan. 1 round = blaster → Scotty Bob → stretch."},{"t":"ex","id":"D2-89","n":"17","name":"Mini Leg Blaster — pain>3: half depth, soft landings","unit":"rounds","rest":"—","tempo":"—","w":[{"s":"8","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"3","kg":"BW"}],"kind":"Lower Push","focus":"EC · Quad Eccentric Endurance","note":"Mini = 10 air squats, 5 in-place lunges/leg, 5 jumping lunges/leg, 5 squat jumps, done without a break. Then Scotty Bob, then a stretch = 1 round.","video":"https://mtntactical.com/exercises/mnt1142-mini-leg-blaster/"},{"t":"ex","id":"D2-90","n":"18","name":"Full Leg Blaster — pain>3: half depth, soft landings","unit":"rounds","rest":"—","tempo":"—","w":[{"s":"—","kg":null},{"s":"4","kg":null},{"s":"5","kg":null},{"s":"5","kg":null},{"s":"—","kg":null}],"kind":"Lower Push","focus":"EC · Quad Eccentric Endurance","note":"Full = 20 air squats, 10 in-place lunges/leg, 10 jumping lunges/leg, 10 squat jumps, done without a break. Then Scotty Bob, then a stretch = 1 round.","video":"https://mtntactical.com/exercises/mnt110-leg-blaster/"},{"t":"ex","id":"D2-91","n":"19","name":"Scotty Bob","unit":"rounds × reps","rest":"—","tempo":"—","w":[{"s":"8×3","kg":10},{"s":"4×5","kg":10},{"s":"5×6","kg":10},{"s":"5×7","kg":10},{"s":"3×3","kg":10}],"kind":"Total Body","focus":"EC · Upper Body Under Fatigue","note":"After every leg-blaster round: push-up, row one dumbbell, push-up, row the other = 1 rep. Cell = rounds × reps. kg per hand.","video":"https://mtntactical.com/exercises/mnt311-scotty-bob/"},{"t":"ex","id":"D2-92","n":"20","name":"Hip Flexor / Pigeon Stretch","unit":"s/side","rest":"—","tempo":"hold","w":[{"s":"30-45","kg":null},{"s":"30-45","kg":null},{"s":"30-45","kg":null},{"s":"30-45","kg":null},{"s":"30-45","kg":null}],"kind":"Mobility","focus":"MOB · Between-Round Mobility","note":"One stretch a const SKEY='ski5week.v1';
let S={week:null,sess:'D1',done:{},kg:{},pain:{},tjt:{t1:'',t2:''},open:{},extra:{},notes:{}};
function load(){try{const j=JSON.parse(localStorage.getItem(SKEY)||'null');if(j&&typeof j==='object')S=Object.assign(S,j)}catch(e){}}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
load();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OFF=s=>s==null||s===''||s==='—'||s==='-';
function defaultWeek(){const t=new Date().toISOString().slice(0,10);let w=0;PLAN.weeks.forEach((x,i)=>{if(x.date&&x.date<=t)w=i});return w}
if(S.week==null||S.week>=PLAN.weeks.length)S.week=defaultWeek();
const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
function curSess(){return PLAN.sessions.find(s=>s.id===S.sess)||PLAN.sessions[0]}
// ---- helpers
function parseName(name){
  let low=null,base=name,std=null;const i=name.indexOf('pain>3:');
  if(i>=0){low=name.slice(i+7).trim();base=name.slice(0,i).replace(/[\s|—-]+$/,'').trim()}
  const k=base.lastIndexOf(' — ');
  if(low!==null&&k>=0){std=base.slice(k+3).trim();base=base.slice(0,k).trim()}
  return {title:base,std,low};
}
function tjtBase(wi){const t1=parseFloat(S.tjt.t1),t2=parseFloat(S.tjt.t2);const t=wi<=2?t1:(isNaN(t2)?t1:t2);return isNaN(t)?null:Math.ceil(t*0.25)+[0,1,2,2,0][wi]}
function specText(ex,wi){
  const w=ex.w[wi];let s=w.s;
  const m=/^\??\s*×\s*(\d+)$|^\?\s*×\s*(\d+)$/.exec(String(s).replace(/\s+/g,' '));
  const q=/^\?\s*×\s*(\d+)$/.exec(String(s)); const n=/^(\d+)\s*×\s*(\d+)$/.exec(String(s));
  if(q||(/Touch-Jump-Touch/.test(ex.name)&&!/TEST/i.test(ex.name)&&/×\s*\d+$/.test(String(s)))){
    const mins=/×\s*(\d+)\s*$/.exec(String(s))[1];const b=tjtBase(wi);
    return b==null?{main:'Do the 2-min test first',sub:'then '+mins+' min EMOM'}:{main:b+' reps / min',sub:'× '+mins+' min (EMOM)'};
  }
  return {main:String(s),sub:''};
}
function nSets(ex,wi){
  const s=String(ex.w[wi].s);
  if(/^\?|×\s*\d+\s*$/.test(s)&&/^(\?|\d+)\s*×\s*\d+$/.test(s)&&/Touch-Jump-Touch/.test(ex.name))return 1;
  let m=/^(\d+)\s*×/.exec(s);if(m)return Math.min(+m[1],12);
  if(/^\d+$/.test(s)&&ex.unit==='rounds')return Math.min(+s,12);
  return 1;
}
function hasKg(ex){return ex.w.some(w=>typeof w.kg==='number'||w.kg==='find'||/^\d+(\.\d+)?$/.test(String(w.kg)))}
function kgText(ex,wi){const k=ex.w[wi].kg;if(k==null||k==='')return '';if(typeof k==='number')return k+' kg';if(k==='BW')return 'BW';if(k==='find')return '';if(k==='band')return 'band';if(/^\d+(\.\d+)?$/.test(k))return k+' kg';return String(k)}
function visibleEx(sess,wi){const out=[];let pend=null;
  for(const it of sess.items){
    if(it.t==='sec'){pend=it;continue}
    if(OFF(it.w[wi].s))continue;
    if(pend){out.push(pend);pend=null}
    out.push(it);
  }return out}
function totals(sess,wi){let d=0,t=0;for(const it of visibleEx(sess,wi)){if(it.t!=='ex')continue;const n=nSets(it,wi);t+=n;const a=S.done[wi+'|'+it.id]||[];for(let i=0;i<n;i++)if(a[i])d++}return {d,t}}
function painKey(wi,sid){return wi+'|'+sid}
function painOrder(){const o=[];PLAN.weeks.forEach((_,wi)=>PLAN.sessions.forEach(s=>{const v=S.pain[painKey(wi,s.id)];if(v!=null)o.push({wi,sid:s.id,v})}));return o}
// ---- render
function renderWeeks(){
  $('weeks').innerHTML=PLAN.weeks.map((w,i)=>`<button class="wk ${i===S.week?'on':''}" data-w="${i}"><b>${w.label}</b><span>${fmtDate(w.date)}</span></button>`).join('');
  $('weeks').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.week=+b.dataset.w;save();renderAll()});
}
function renderTabs(){
  $('tabs').innerHTML=PLAN.sessions.map(s=>{const wi=S.week,t=totals(s,wi);const off=t.t===0;
    return `<button class="tab ${s.id===S.sess?'on':''}" data-s="${s.id}">${s.id}<small>${off?'none':(t.d+'/'+t.t)}</small></button>`}).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.sess=b.dataset.s;save();renderAll();window.scrollTo(0,0)});
}
function renderBanner(){
  const o=painOrder();const last=o.slice(-2);let msg='';
  const cur=S.pain[painKey(S.week,S.sess)];
  if(cur!=null&&cur>5)msg='Pain above 5/10 today: skip the jumps and the blasters. Keep the bike, the isometrics and the slow strength work.';
  else if(last.length===2&&last[0].v>3&&last[1].v>3)msg='Two sessions in a row above 3/10: no jumps (landings, box jumps, TJT, blasters) for the rest of this week. Keep the bike, the isometrics and the slow strength work, then restart one level lower.';
  $('banner').innerHTML=msg?`<div class="banner">${esc(msg)}</div>`:'';
}
function secTitle(t){let x=t.split(/\. /)[0].replace(/\.$/,'');if(x.length>80)x=x.slice(0,78)+'…';return x}
function exCard(ex,wi,painNow){
  const nm=parseName(ex.name);const key=wi+'|'+ex.id;const n=nSets(ex,wi);const arr=S.done[key]||[];
  const doneAll=n>0&&arr.slice(0,n).filter(Boolean).length===n;
  const sp=specText(ex,wi);const kt=kgText(ex,wi);
  const isTest=/TEST/i.test(ex.name);
  const lowHot=nm.low&&painNow!=null&&painNow>3;
  const skip=nm.low&&painNow!=null&&painNow>5&&/jump|hop|bound|landing|blaster|touch-jump/i.test(ex.name);
  let h=`<div class="ex ${doneAll?'done':''}" data-k="${key}"><div class="h"><div class="num">${esc(ex.n)}</div><div style="min-width:0"><div class="nm">${esc(nm.title)}</div>`;
  if(nm.std)h+=`<div class="std">${esc(nm.std)}</div>`;
  if(nm.low)h+=`<span class="low ${lowHot?'hot':''}">pain&gt;3: ${esc(nm.low)}</span>`;
  if(skip)h+=`<span class="skip">skip today</span>`;
  h+=`</div></div><div class="spec"><span><b>${esc(sp.main)}</b>${sp.sub?' <span class="muted">'+esc(sp.sub)+'</span>':''}</span>`;
  if(sp.main!==String(ex.w[wi].s)||true){} 
  if(kt)h+=`<span>${esc(kt)}</span>`;
  h+=`<span class="muted">${esc(ex.unit||'')}${ex.rest&&ex.rest!=='—'?' · rest '+esc(ex.rest):''}${ex.tempo&&ex.tempo!=='—'?' · tempo '+esc(ex.tempo):''}</span></div>`;
  h+=`<div class="sets">`;
  for(let i=0;i<n;i++)h+=`<button class="set ${arr[i]?'on':''}" data-i="${i}" aria-label="Set ${i+1}">${arr[i]?'✓':(n===1?'Done':i+1)}</button>`;
  const kv=S.kg[key]||'';
  if(hasKg(ex))h+=`<input class="kg" inputmode="decimal" placeholder="${/^\d/.test(kt)?esc(kt.replace(' kg','')):'kg'}" value="${esc(kv)}" aria-label="Weight used">`;
  h+=`</div>`;
  if(isTest){const f=wi===0?'t1':'t2';h+=`<div class="tjt"><label>Reps in 2 min<br><input type="number" inputmode="numeric" data-tjt="${f}" value="${esc(S.tjt[f])}"></label>`+(tjtBase(wi)!=null?`<div><div class="emom">${tjtBase(wi)}</div><div class="small muted">reps / min this week</div></div>`:'')+`</div>`}
  const open=S.open[ex.id];
  h+=`<div class="links"><button data-note="1">${open?'Hide':'How'}</button>${ex.video?`<a href="${esc(ex.video)}" target="_blank" rel="noopener">Video</a>`:''}</div>`;
  if(open)h+=`<div class="note">${esc(ex.note||'')}</div>${ex.focus?`<div class="tag">${esc(ex.kind||'')} · ${esc(ex.focus)}</div>`:''}`;
  return h+`</div>`;
}
function renderMain(){
  const wi=S.week,sess=curSess(),w=PLAN.weeks[wi];const pk=painKey(wi,sess.id);const painNow=S.pain[pk];
  const vis=visibleEx(sess,wi);
  let h=`<div class="sess-title">${esc(sess.id)} · ${esc(sess.heading.replace(/^OPTIONAL:\s*/,''))}${sess.opt?'<span class="opt">optional</span>':''}</div><div class="sess-meta">${esc(sess.meta)}</div>`;
  if(vis.length===0)return $('main').innerHTML=h+`<div class="card muted">No ${esc(sess.id)} session in ${esc(w.label)}.</div>`;
  h+=`<div class="small muted" style="margin-top:8px">Knee pain: use the bar at the bottom. 0–3 as planned, above 3 the low version of every jump, above 5 skip the jumps.</div>`;
  let secs=[];
  vis.forEach((it,ix)=>{
    if(it.t==='sec'){let a=0,t=0;for(let j=ix+1;j<vis.length&&vis[j].t==='ex';j++){const n=nSets(vis[j],wi);t+=n;const ar=S.done[wi+'|'+vis[j].id]||[];for(let q=0;q<n;q++)if(ar[q])a++}
      h+=`<div class="sec"><span>${esc(secTitle(it.text))}</span><span class="cnt">${a}/${t}</span></div>`}
    else h+=exCard(it,wi,painNow);
  });
  const xk=wi+'|'+sess.id;const ex2=S.extra[xk]||[];
  h+=`<div class="sec"><span>Added by you</span><span class="cnt">${ex2.filter(x=>x.done&&x.done.filter(Boolean).length>=x.sets).length}/${ex2.length}</span></div>`;
  ex2.forEach((x,xi)=>{const a=x.done||[];
    h+=`<div class="ex" data-x="${xi}"><div class="h"><div class="num">+</div><div style="min-width:0"><div class="nm">${esc(x.name)}</div></div><button class="xbtn" data-del="${xi}" aria-label="Remove">✕</button></div>
    <div class="spec"><span><b>${x.sets}×${esc(x.reps||'')}</b></span></div><div class="sets">`;
    for(let i=0;i<x.sets;i++)h+=`<button class="set ${a[i]?'on':''}" data-xi="${i}">${a[i]?'✓':i+1}</button>`;
    h+=`<input class="kg" inputmode="decimal" placeholder="kg" value="${esc(x.kg||'')}" data-xkg="1"></div></div>`});
  h+=`<div class="add"><button class="btn" id="addEx">+ Add exercise</button></div>
  <div class="card" style="margin-top:14px"><h2>Session notes</h2><textarea id="snote" placeholder="How it felt, what you changed…">${esc(S.notes[xk]||'')}</textarea></div>
  <div style="margin-top:12px"><button class="btn alt" id="resetSess">Clear this session</button></div>`;
  $('main').innerHTML=h;
  // handlers
  
  $('main').querySelectorAll('.ex[data-k]').forEach(card=>{
    const key=card.dataset.k;const id=key.split('|')[1];
    card.querySelectorAll('.set').forEach(b=>b.onclick=()=>{const a=S.done[key]||[];a[+b.dataset.i]=a[+b.dataset.i]?0:1;S.done[key]=a;save();renderTabs();renderMainKeepScroll()});
    const kg=card.querySelector('.kg');if(kg)kg.oninput=()=>{S.kg[key]=kg.value;save()};
    const nb=card.querySelector('[data-note]');nb.onclick=()=>{S.open[id]=!S.open[id];save();renderMainKeepScroll()};
    const tj=card.querySelector('[data-tjt]');if(tj)tj.onchange=()=>{S.tjt[tj.dataset.tjt]=tj.value;save();renderMainKeepScroll()};
  });
  $('resetSess').onclick=()=>{if(!window.__confirmReset){window.__confirmReset=1;$('resetSess').textContent='Tap again to clear';$('resetSess').classList.add('bad');setTimeout(()=>{window.__confirmReset=0;const b=$('resetSess');if(b){b.textContent='Clear this session';b.classList.remove('bad')}},3000);return}
    window.__confirmReset=0;for(const it of sess.items)if(it.t==='ex'){delete S.done[wi+'|'+it.id];delete S.kg[wi+'|'+it.id]}delete S.pain[pk];delete S.extra[xk];delete S.notes[xk];save();renderAll()};
  $('main').querySelectorAll('[data-x]').forEach(card=>{const xi=+card.dataset.x;const x=S.extra[xk][xi];
    card.querySelectorAll('[data-xi]').forEach(b=>b.onclick=()=>{x.done=x.done||[];x.done[+b.dataset.xi]=x.done[+b.dataset.xi]?0:1;save();renderMainKeepScroll()});
    card.querySelector('[data-xkg]').oninput=e=>{x.kg=e.target.value;save()};
    card.querySelector('[data-del]').onclick=()=>{S.extra[xk].splice(xi,1);save();renderMainKeepScroll()}});
  $('addEx').onclick=()=>openAdd(xk);
  const sn=$('snote');sn.oninput=()=>{S.notes[xk]=sn.value;save()};
  const t=totals(sess,wi);$('prog').style.width=(t.t?Math.round(100*t.d/t.t):0)+'%';
}
function renderMainKeepScroll(){const y=window.scrollY;renderMain();renderBanner();window.scrollTo(0,y)}
function renderPbar(){
  const pk=painKey(S.week,S.sess),cur=S.pain[pk];let h='<label>Knee<br>pain</label>';
  for(let i=0;i<=10;i++)h+=`<button class="${cur===i?'on '+(i>5?'hi':i>3?'mid':''):''}" data-p="${i}" aria-label="Pain ${i}">${i}</button>`;
  $('pbar').innerHTML=h;
  $('pbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=+b.dataset.p;if(S.pain[pk]===v)delete S.pain[pk];else S.pain[pk]=v;save();renderAll()});
}
function renderAll(){renderWeeks();renderTabs();renderBanner();renderPbar();renderMain()}
// ---- add exercise
function library(){const seen={},out=[];PLAN.sessions.forEach(s=>s.items.forEach(it=>{if(it.t!=='ex')return;const t=parseName(it.name).title;if(!seen[t]){seen[t]=1;out.push(t)}}));
  ['Push-up','Plank','Side plank','Dead bug','Hollow body hold','Glute bridge','Hip thrust','Goblet squat','Romanian deadlift','Calf raise','Tibialis raise','Pull-up','Chin-up','Dumbbell row','Farmer carry','Foam roll'].forEach(t=>{if(!seen[t]){seen[t]=1;out.push(t)}});
  return out.sort((a,b)=>a.localeCompare(b))}
function openAdd(xk){
  const lib=library();
  $('addPanel').innerHTML=`<h2 style="margin:0 0 6px">Add an exercise</h2><div class="small muted">Pick one from your plan or type your own. It is saved for this session only.</div>
   <div class="field" style="margin-top:10px"><span>Exercise</span><input id="axName" placeholder="Search or type a name" autocomplete="off"></div>
   <div class="lib" id="axLib"></div>
   <div class="add"><label class="field"><span>Sets</span><input id="axSets" type="number" inputmode="numeric" value="3" min="1" max="12"></label>
   <label class="field"><span>Reps / time</span><input id="axReps" placeholder="10 or 30 s"></label>
   <label class="field"><span>kg</span><input id="axKg" inputmode="decimal" placeholder="optional"></label></div>
   <div style="margin-top:12px"><button class="btn" id="axOk">Add</button><button class="btn alt" id="axNo">Cancel</button></div>`;
  const draw=()=>{const q=$('axName').value.trim().toLowerCase();const m=lib.filter(t=>!q||t.toLowerCase().includes(q)).slice(0,40);
    $('axLib').innerHTML=m.map(t=>`<button data-t="${esc(t)}">${esc(t)}</button>`).join('')||'<div class="small muted" style="padding:9px 10px">No match: it will be added as typed.</div>';
    $('axLib').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('axName').value=b.dataset.t;draw()})};
  $('axName').oninput=draw;draw();
  $('axNo').onclick=()=>closeSheet('sheetAdd');
  $('axOk').onclick=()=>{const name=$('axName').value.trim();if(!name){$('axName').focus();return}
    const sets=Math.max(1,Math.min(12,parseInt($('axSets').value)||1));
    (S.extra[xk]=S.extra[xk]||[]).push({name,sets,reps:$('axReps').value.trim(),kg:$('axKg').value.trim(),done:[]});
    save();closeSheet('sheetAdd');renderMainKeepScroll()};
  openSheet('sheetAdd');
}
// ---- overview + settings
function openSheet(id){$(id).classList.add('on')}
function closeSheet(id){$(id).classList.remove('on')}
['sheetWeek','sheetSet','sheetAdd'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.id===id)closeSheet(id)}));
$('btnWeek').onclick=()=>{
  const w=PLAN.weeks[S.week];
  $('weekPanel').innerHTML=`<h2 style="margin:0 0 8px">${esc(w.label)} · ${esc(w.phase||'')} · week of ${fmtDate(w.date)}</h2>
  <div class="card wkcard"><dl><dt>TJT EMOM</dt><dd>${esc(w.emom)} min (D1 / D3)</dd><dt>Landings</dt><dd>${esc(w.landing)}</dd><dt>Blasters (D2)</dt><dd>${esc(w.blasters)}</dd><dt>Chassis grind</dt><dd>${esc(w.chassis)}</dd><dt>D4 circuit</dt><dd>${esc(w.circuit)}</dd></dl></div>
  <div class="card"><h2>Pain log</h2>${PLAN.weeks.map((x,wi)=>`<div class="small"><b>${x.label}</b> ${PLAN.sessions.map(s=>{const v=S.pain[painKey(wi,s.id)];return s.id+': '+(v==null?'–':v)}).join(' · ')}</div>`).join('')}</div>
  <button class="btn" id="closeWeek">Close</button>`;
  $('closeWeek').onclick=()=>closeSheet('sheetWeek');openSheet('sheetWeek');
};
$('btnSet').onclick=()=>{
  $('setPanel').innerHTML=`<h2 style="margin:0 0 6px">Settings</h2>
  <div class="card"><h2>Backup your log</h2><div class="small muted">Your sets, weights and pain log live on this phone only. Copy the text below and keep it, or paste a saved copy to restore it.</div>
  <textarea id="bk" spellcheck="false"></textarea>
  <button class="btn" id="bkExp">Export</button><button class="btn alt" id="bkImp">Import</button><div class="small muted" id="bkMsg" style="margin-top:6px"></div></div>
  <div class="card"><h2>Theme</h2><button class="btn alt" data-th="">System</button><button class="btn alt" data-th="light">Light</button><button class="btn alt" data-th="dark">Dark</button></div>
  <div class="card"><h2>Install on your phone</h2><div class="small muted">iPhone: Safari, Share, Add to Home Screen. Android: Chrome menu, Install app.</div></div>
  <div class="card"><h2>Start over</h2><div class="small muted">Clears every tick, weight, pain score and test result.</div><button class="btn bad" id="wipe">Clear everything</button></div>
  <button class="btn" id="closeSet">Close</button>`;
  $('closeSet').onclick=()=>closeSheet('sheetSet');
  $('bkExp').onclick=()=>{const t=JSON.stringify({done:S.done,kg:S.kg,pain:S.pain,tjt:S.tjt,extra:S.extra,notes:S.notes});$('bk').value=t;$('bk').select();
    let ok=false;try{navigator.clipboard.writeText(t).then(()=>{$('bkMsg').textContent='Copied.'},()=>{});ok=true}catch(e){}
    $('bkMsg').textContent=ok?'Copied to the clipboard. If not, select the text and copy it.':'Select the text and copy it.'};
  $('bkImp').onclick=()=>{try{const j=JSON.parse($('bk').value);if(!j||typeof j!=='object')throw 0;S.done=j.done||{};S.kg=j.kg||{};S.pain=j.pain||{};S.tjt=j.tjt||{t1:'',t2:''};S.extra=j.extra||{};S.notes=j.notes||{};save();renderAll();$('bkMsg').textContent='Restored.'}catch(e){$('bkMsg').textContent='That text is not a valid backup.'}};
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{const v=b.dataset.th;if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('ski5week.theme',v)}catch(e){}});
  let c=0;$('wipe').onclick=()=>{c++;if(c<2){$('wipe').textContent='Tap again to confirm';return}S.done={};S.kg={};S.pain={};S.tjt={t1:'',t2:''};S.open={};S.extra={};S.notes={};save();renderAll();closeSheet('sheetSet')};
  openSheet('sheetSet');
};
try{const th=localStorage.getItem('ski5week.theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
renderAll();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>

</body></html>
