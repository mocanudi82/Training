<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#222a2a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ski Training">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%}</style>
<title>Ski Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Raleway:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#f6f8f7; --bg0:#f6f8f7; --dm:11%; --card:#ffffff; --ink:#0d1b2a; --muted:#4f6b73; --line:#d3dcdb; --shadow:#dbe3e2;
  --accent:#ff6f3c; --accent-t:#c2430f; --accent-ink:#0d1b2a; --accent-soft:#fbd9c9;
  --ok:#3f6f6f; --ok-soft:#d9e6e1; --warn:#7a5a00; --warn-soft:#f8e7a8; --bad:#b8381f; --bad-soft:#f8d5ca;
  --chip:#e8eeed; --s1:#0d1b2a; --s2:#ff6f3c; --s3:#f2b705; --s4:#5d8a8a;
  --fm:"Space Mono",ui-monospace,Menlo,Consolas,monospace; --fb:"Souliyo Unicode","Raleway","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d3752; --bg0:#1d3752; --dm:20%; --card:#294a68; --ink:#f4eedc; --muted:#b4cccc; --line:#41627f; --shadow:#142a3f;
  --accent:#ff6f3c; --accent-t:#ff8f63; --accent-ink:#0d1b2a; --accent-soft:#4a2a22;
  --ok:#7fb5b5; --ok-soft:#1f4547; --warn:#f2b705; --warn-soft:#4a3b0a; --bad:#ff8f7a; --bad-soft:#5a2a22;
  --chip:#365a7c; --s1:#f2ebd7; --s2:#ff6f3c; --s3:#f2b705; --s4:#5d8a8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d3752; --bg0:#1d3752; --dm:20%; --card:#294a68; --ink:#f4eedc; --muted:#b4cccc; --line:#41627f; --shadow:#142a3f;
  --accent:#ff6f3c; --accent-t:#ff8f63; --accent-ink:#0d1b2a; --accent-soft:#4a2a22;
  --ok:#7fb5b5; --ok-soft:#1f4547; --warn:#f2b705; --warn-soft:#4a3b0a; --bad:#ff8f7a; --bad-soft:#5a2a22;
  --chip:#365a7c; --s1:#f2ebd7; --s2:#ff6f3c; --s3:#f2b705; --s4:#5d8a8a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--fb);
  margin:0;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.row{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;letter-spacing:.2px;text-wrap:balance}
.sp{flex:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:18px}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:64px;padding:7px 10px;border-radius:12px;background:var(--chip);text-align:center;line-height:1.15;border:2px solid transparent}
.wk b{display:block;font-size:15px}.wk span{font-size:11px;color:var(--muted)}
.wk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.wk.on span{color:var(--accent-ink);opacity:.85}
.tabs{display:flex;gap:6px;padding-top:8px}
.tab{flex:1;padding:8px 4px;border-radius:10px;background:var(--chip);text-align:center;font-weight:600;font-size:14px;line-height:1.15}
.tab small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--bg)}.tab.on small{color:var(--bg);opacity:.75}
.bar{height:5px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 4px}
.muted{color:var(--muted)}.small{font-size:13px}
.sess-title{margin:14px 0 2px;font-size:17px;font-weight:700;text-wrap:balance}
.sess-meta{font-size:13px;color:var(--muted)}
.opt{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
.pain{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pain button{width:36px;height:34px;border-radius:9px;background:var(--chip);font-weight:600}
.pain button.on{background:var(--ok);color:var(--bg)}.pain button.on.mid{background:var(--warn)}.pain button.on.hi{background:var(--bad)}
.blk{border-left:5px solid var(--bc);background:color-mix(in srgb,var(--bc) 15%,transparent);border-radius:0 14px 14px 0;padding:2px 0 4px 8px;margin:14px 0 0}
.blk .sec{margin:8px 0 4px;color:color-mix(in srgb,var(--bc) 70%,var(--ink))}
.swlist{flex:1 1 100%;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:2px 0 6px}
.swh{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px;position:sticky;top:0;background:var(--card)}
.swit{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;font:inherit}
.swit.on{background:var(--accent-soft);font-weight:700}
.sec{margin:18px 0 4px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.sec .cnt{margin-left:auto;font-weight:600;letter-spacing:0}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0}
.ex.done{opacity:.6}
.ex .h{display:flex;gap:8px;align-items:flex-start}
.num{flex:0 0 auto;min-width:24px;height:24px;border-radius:8px;background:var(--chip);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.ex .nm{font-weight:650;line-height:1.25}
.ex .std{font-size:13px;color:var(--muted);margin-top:1px}
.low{display:inline-block;margin-top:4px;font-size:12.5px;padding:2px 8px;border-radius:8px;background:var(--chip);color:var(--muted)}
.low.hot{background:var(--warn-soft);color:var(--warn);font-weight:700}
.skip{display:inline-block;margin:4px 0 0 6px;font-size:12.5px;padding:2px 8px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:700}
.spec{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px}
.spec b{font-size:17px}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;align-items:center}
.set{width:44px;height:44px;border-radius:12px;background:var(--chip);font-weight:700;color:var(--muted);border:2px solid transparent}
.set.on{background:var(--ok);color:var(--bg)}
.kg{width:86px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;text-align:center;margin-left:auto}
.kg::placeholder{color:var(--muted)}
.links{display:flex;gap:14px;margin-top:8px;font-size:13.5px}
.links button,.links a{color:var(--accent-t);text-decoration:none;font-weight:600}
.note{margin-top:8px;font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:9px 10px}
.tag{font-size:11px;color:var(--muted);margin-top:6px}
.tjt{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tjt label{font-size:13px;color:var(--muted)}
.tjt input{width:90px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.emom{font-size:18px;font-weight:700;color:var(--accent-t)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel .in{max-width:720px;margin:0 auto}
.btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;margin:6px 8px 0 0}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.bad{background:var(--bad-soft);color:var(--bad)}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.wkcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0;font-size:14px}.wkcard dt{color:var(--muted)}.wkcard dd{margin:0}

.pbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.pbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:4px}
.pbar label{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px;line-height:1.1;text-align:center}
.pbar button{flex:1;min-width:0;height:38px;border-radius:9px;background:var(--chip);font-weight:700;font-size:14px}
.pbar button.on{background:var(--ok);color:var(--bg)}.pbar button.on.mid{background:var(--warn)}.pbar button.on.hi{background:var(--bad)}
.add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:90px}
.field input,.field textarea{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit;font-size:16px}
.field textarea{height:auto;min-height:70px;padding:8px 10px;font-family:inherit}
.lib{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--card)}
.lib button{display:block;width:100%;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:15px}
.lib button:last-child{border-bottom:0}
.xbtn{margin-left:auto;color:var(--bad);font-weight:700;padding:4px 8px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

.edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:flex-end;padding:10px;border-radius:12px;background:var(--bg)}
.edit select{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 8px}
.edit .btn{margin:0}
.swp{font-size:12.5px;color:var(--accent-t);margin-top:2px}
.hist summary{cursor:pointer;padding:8px 0;font-weight:600;font-size:14px}
.hist .li{font-size:13.5px;padding:2px 0 2px 10px;color:var(--ink)}
.hist details{border-bottom:1px solid var(--line)}

.tmr{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;max-width:704px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tmr.on{display:block}
.tmr .l{font-size:12px;opacity:.75;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.tmr .big{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tmr .s{font-size:14px;opacity:.9}
.tmr .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tmr button{padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:700;margin-left:6px}
.tmr.go .big{color:#6be08f}
.tmr.warn .big{color:#ffb454}
.sclk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.sclk button{padding:7px 12px;border-radius:10px;background:var(--chip);font-weight:700}
.sclk b{font-variant-numeric:tabular-nums}
.mq{background:var(--accent-soft);color:var(--ink)}
.mq .mrow{display:flex;gap:4px;margin-top:8px}
.mq .mrow button{flex:1;min-width:0;height:36px;border-radius:9px;background:var(--card);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px}
.lg{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin:4px 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.minih{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:10px}
.tjh{width:90px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}

/* ===== retro 70s layer ===== */
.sub{font-size:12px;color:var(--muted);letter-spacing:.4px;margin-top:1px}
body,button,input,textarea,select{font-family:var(--fb)}
body{font-variant-numeric:lining-nums}
h1,h2,.sess-title,.sec,.tab,.wk,.btn,.links button,.links a,.low,.skip,.opt,.minih,.tmr .l,.pbar label{font-family:var(--fb);font-weight:700}
.set,.kg,.spec b,.emom,.big,.num,.pbar button,.mrow button,.sclk b,.tjh,.tjt input,.field input,.cnt,.wk span,.tab small{font-family:var(--fm)}
h1{font-size:16px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;white-space:nowrap}
h1::before{content:"✦ ";color:var(--accent-t)}
header.top{border-bottom:0;padding-bottom:4px}
header.top::after{content:"";display:block;height:14px;margin-top:8px;border-radius:7px;background:linear-gradient(var(--s1) 0 25%,var(--s2) 25% 50%,var(--s4) 50% 75%,var(--s3) 75%)}
.iconbtn{border:2px solid var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--ink)}
.wk{border:2px solid var(--ink);background:var(--card);border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.wk.on{background:var(--accent);border-color:var(--ink)}
.tab{border:2px solid var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}
.bar{height:8px;border:2px solid var(--ink);background:var(--card)}.bar i{background:repeating-linear-gradient(90deg,var(--s2) 0 8px,var(--s3) 8px 16px)}
.sess-title{text-transform:uppercase;font-size:15px;letter-spacing:.6px;color:var(--accent-t);line-height:1.25}
.sess-meta{font-size:13px}
.card,.ex{border:2px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--shadow)}
.ex .nm{font-family:var(--fb);font-weight:700;font-size:16px}
.num{border-radius:50%;background:var(--s3);color:#0d1b2a;border:2px solid var(--ink);min-width:26px;height:26px}
.sec{font-size:11.5px;letter-spacing:.8px;color:var(--ink)}
.blk{border-left-width:6px;border-radius:4px 16px 16px 4px}
.set{border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.set.on{background:radial-gradient(circle,var(--ink) 0 34%,var(--s2) 36% 60%,var(--s3) 62%);color:var(--bg);border-color:var(--ink)}
.kg,.tjt input,.tjh,.field input,.field textarea,textarea{border:2px solid var(--ink);background:var(--card)}
.btn{border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;font-size:13px;letter-spacing:.4px}
.btn.alt{background:var(--card)}
.links button,.links a{font-size:13px;text-transform:uppercase;letter-spacing:.3px}
.pbar{border-top:2px solid var(--ink);background:var(--card)}
.pbar button{border:2px solid var(--ink);background:var(--chip);border-radius:50%;height:auto;aspect-ratio:1/1;max-height:38px;font-size:12.5px}
.pbar button.on{background:var(--ok);color:var(--bg)}
.tmr{background:var(--ink);color:var(--bg);border:2px solid var(--s3)}
.note{font-family:var(--fb);background:var(--chip)}
.panel{border-top:4px solid var(--s2)}
.banner{border:2px solid var(--bad)}
.mq{border-color:var(--accent)}
/* colour pass: all palette colours */
:root{--c-or:#ff6f3c;--c-te:#5d8a8a;--c-la:#b39acd;--c-ye:#f2b705;--c-na:#0d1b2a}
header.top::after{height:14px;background:linear-gradient(var(--s1) 0 20%,var(--s2) 20% 40%,var(--s3) 40% 60%,var(--s4) 60% 80%,var(--c-la) 80%)}
.wk[data-w="0"]{--tc:var(--c-te)}.wk[data-w="1"]{--tc:var(--c-or)}.wk[data-w="2"]{--tc:var(--c-la)}.wk[data-w="3"]{--tc:var(--c-ye)}.wk[data-w="4"]{--tc:#8fb8b8}
.tab[data-s="D1"]{--tc:var(--c-or)}.tab[data-s="D2"]{--tc:var(--c-te)}.tab[data-s="D3"]{--tc:var(--c-la)}.tab[data-s="D4"]{--tc:var(--c-ye)}
.wk,.tab{background:color-mix(in srgb,var(--tc) 24%,var(--card))}
.wk.on,.tab.on{background:var(--tc);color:#0d1b2a}
.wk.on span,.tab.on small{color:#0d1b2a;opacity:.8}
/* meaningful background colours */
html{--dc:#ff6f3c}
html[data-day="D1"]{--dc:#ff6f3c}html[data-day="D2"]{--dc:#5d8a8a}html[data-day="D3"]{--dc:#b39acd}html[data-day="D4"]{--dc:#f2b705}
:root[data-day]:not([data-x1]):not([data-x2]){--bg:color-mix(in srgb,var(--dc) var(--dm),var(--bg0))}
.blk{background:color-mix(in srgb,var(--bc) 22%,transparent)}
.blk .ex{background:color-mix(in srgb,var(--bc) 8%,var(--card))}
.ex.done{opacity:1;background:color-mix(in srgb,#5d8a8a 26%,var(--card))!important}
.ex.done .nm{opacity:.75}
.pbar{background:color-mix(in srgb,var(--c-te) 22%,var(--card))}
.pbar[data-z="mid"]{background:color-mix(in srgb,var(--c-ye) 38%,var(--card))}
.pbar[data-z="hi"]{background:color-mix(in srgb,var(--c-or) 38%,var(--card))}
.pbar[data-z="none"]{background:var(--card)}
.blk .num{background:var(--bc);color:#0d1b2a}
.blk .sec{margin:10px 0 6px;color:#0d1b2a}
.blk .sec>span:first-child{background:var(--bc);padding:3px 10px;border-radius:999px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.9}
.blk .sec .cnt{color:var(--ink)}
.links{gap:8px;flex-wrap:wrap}
.links button,.links a{padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--lc,var(--c-te)) 26%,var(--card));color:var(--ink)}
.links [data-note]{--lc:var(--c-te)}.links a{--lc:var(--c-la)}.links [data-edit]{--lc:var(--c-ye)}.links [data-swap]{--lc:var(--c-or)}
.links [data-tm]{background:var(--c-or);color:#0d1b2a}
.pbar button[data-p="0"],.pbar button[data-p="1"],.pbar button[data-p="2"],.pbar button[data-p="3"]{background:color-mix(in srgb,var(--c-te) 30%,var(--card))}
.pbar button[data-p="4"],.pbar button[data-p="5"]{background:color-mix(in srgb,var(--c-ye) 40%,var(--card))}
.pbar button[data-p="6"],.pbar button[data-p="7"],.pbar button[data-p="8"],.pbar button[data-p="9"],.pbar button[data-p="10"]{background:color-mix(in srgb,var(--c-or) 40%,var(--card))}

<script>
const PLAN = {"title":"Ski Prep 5-Week","version":"202611091622","weeks":[{"label":"W1","phase":"BUILD","date":"2026-11-09","emom":"15 / 20","landing":"2-leg stick","blasters":"8 mini","chassis":"Set A","circuit":"Spect. 5×4"},{"label":"W2","phase":"BUILD","date":"2026-11-16","emom":"20 / 20","landing":"2-leg stick","blasters":"4 full","chassis":"Set A","circuit":"Spect. 5×5"},{"label":"W3","phase":"LOAD","date":"2026-11-23","emom":"20 / 20","landing":"1-leg hop fwd + matrix","blasters":"5 full","chassis":"Set B","circuit":"Renegade 5×5"},{"label":"W4","phase":"PEAK","date":"2026-11-30","emom":"15 / 20","landing":"1-leg hop matrix","blasters":"5 full","chassis":"Set C","circuit":"Toss 4×5"},{"label":"W5","phase":"TAPER · trip","date":"2026-12-07","emom":"10 / 10","landing":"1-leg hop matrix","blasters":"3 mini","chassis":"Set C × 2","circuit":"—"}],"sessions":[{"id":"D1","day":"D1 MON core","heading":"LANDINGS + HEAVY LOWER + LACTATE","meta":"CORE · ~65-75 min (test weeks W1 and W4 included)","opt":false,"items":[{"t":"sec","text":"KNEE & ARCH PREP (kiné block) + RAMP + landing control (~15 min). Weaker leg first on every single-leg drill. Pain rule: 0-3/10 go, above 3 use the low version of every jump, above 5 skip the jumps."},{"t":"ex","id":"D1-36","n":"1","name":"Lateral Band Walk — knees out","unit":"reps/side","rest":"—","tempo":"—","w":[{"s":"2×10","kg":"band"},{"s":"2×12","kg":"band"},{"s":"2×12","kg":"band"},{"s":"2×12","kg":"band"},{"s":"1×12","kg":"band"}],"kind":"Lateral Plane","focus":"LA · Glute Medius","note":"Band above the knees, knees pushed out, toes forward, small steps, hips low. The glute medius is what stops the knee caving in.","video":"https://www.youtube.com/results?search_query=lateral+band+walk"},{"t":"ex","id":"D1-37","n":"2","name":"Single-Leg Box Squat — 40 cm | pain>3: 50 cm","unit":"reps/side","rest":"—","tempo":"3-1-1-0","w":[{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"1×10","kg":"BW"}],"kind":"Lower Push","focus":"STR · Knee Control (anti-valgus)","note":"Your kiné exercise. Sit back to a 40 cm box on one leg (pain >3: 50 cm box, less knee bend), 3 s down, light touch, stand without rocking. The knee tracks over the second toe, no cave-in: a mini band above the knee or a hand on a post if it drifts. Weaker leg first. 0-3/10 is fine, above 3 use the higher box.","video":"https://www.youtube.com/results?search_query=single+leg+box+squat+knee+valgus"},{"t":"ex","id":"D1-38","n":"3","name":"Short-Foot + Big-Toe Stance — now in the evening Mobility routine","unit":"s/side","rest":"—","tempo":"hold","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Balance","focus":"LA · Arch & Foot Control","note":"Moved to the evening routine on the Mobility sheet (Section 3), 2×30 s per side, done at home after training.","video":"https://www.youtube.com/results?search_query=short+foot+exercise+big+toe+raise"},{"t":"ex","id":"D1-39","n":"4","name":"Single-Leg Calf Raise — big toe pressed down (arch)","unit":"reps/side","rest":"—","tempo":"2-1-2-0","w":[{"s":"1×10","kg":"BW"},{"s":"1×10","kg":"BW"},{"s":"1×10","kg":"BW"},{"s":"1×10","kg":"BW"},{"s":"—","kg":"BW"}],"kind":"Isolation","focus":"STR · Soleus / Arch","note":"Stand on one leg, rise onto the ball of the foot while pressing the big toe down and keeping the arch up (no rolling out onto the little toe), 2 s up, 1 s hold, 2 s down. Calf strength plus the arch. Replaces the double calf + tibialis set here to keep the session under 80 min; D3 and D4 keep the calf + tibialis raises.","video":"https://www.youtube.com/results?search_query=single+leg+calf+raise+big+toe"},{"t":"ex","id":"D1-40","n":"5","name":"Spanish Squat Hold — band behind the knees","unit":"s","rest":"45 s","tempo":"hold","w":[{"s":"3×45","kg":"band"},{"s":"3×45","kg":"band"},{"s":"3×45","kg":"band"},{"s":"3×45","kg":"band"},{"s":"2×45","kg":"band"}],"kind":"Lower Push","focus":"STR · Patellar Tendon Isometric","note":"Band or strap behind the knees, lean back with the shins vertical, thighs about 60° bent, hold. Your kiné isometric: it loads the tendon without sliding the kneecap and quiets the knee before the jumps. Hold at 0-3/10, stop at 4. Time saver: do the one-leg Pallof press during the 45 s rests between holds.","video":"https://www.youtube.com/results?search_query=spanish+squat+isometric+patellar+tendon"},{"t":"ex","id":"D1-41","n":"6","name":"Eccentric Step-Down — 10 cm | pain>3: 6 cm","unit":"reps/side","rest":"—","tempo":"3-0-1-0","w":[{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"2×10","kg":"BW"},{"s":"1×10","kg":"BW"}],"kind":"Lower Push","focus":"EC · Quad Eccentric Control (patellar tendon)","note":"Kiné step-down. Stand on a 10 cm step (pain >3: 6 cm, or hold a post), lower the other heel to the floor over 3 s with the knee over the second toe, touch lightly and stand. Go higher only if the knee stays under 3/10.","video":"https://www.youtube.com/results?search_query=eccentric+step+down+patellofemoral"},{"t":"ex","id":"D1-42","n":"7","name":"Single-Leg Balance — eyes closed","unit":"s/side","rest":"—","tempo":"hold","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"2×30","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Balance","focus":"LA · Balance & Proprioception","note":"Eyes closed, same soft ski stance. Touch a rail when you need to; aim for 30 s clean each side.","video":"https://www.youtube.com/results?search_query=single+leg+balance+eyes+closed"},{"t":"ex","id":"D1-43","n":"8","name":"Pallof Press — on one leg (arch)","unit":"reps/side","rest":"—","tempo":"1-2-1-0","w":[{"s":"2×8","kg":"band"},{"s":"2×8","kg":"band"},{"s":"2×10","kg":"band"},{"s":"2×10","kg":"band"},{"s":"2×8","kg":"band"}],"kind":"Rotational","focus":"RP · Anti-Rotation + Arch","note":"Band at chest height, stand on ONE leg with a soft knee, press out and hold 2 s, resist the pull. Hips level, arch up, no knee wobble. Trunk stiffness plus single-leg arch and hip stability in one drill. Weaker leg stands first. Foot slips or the knee drifts in: go back to the split stance.","video":"https://www.youtube.com/results?search_query=single+leg+pallof+press"},{"t":"ex","id":"D1-44","n":"9","name":"Drop Landing — 30 cm | pain>3: 15 cm","unit":"reps","rest":"30 s","tempo":"stick","w":[{"s":"3×5","kg":"BW"},{"s":"3×5","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Landing","focus":"PLY · Landing Mechanics","note":"Step off, land on both feet, stick 2 s: hips back, knees over the 2nd toe, never inside. Quiet feet. Step off a 30 cm box (pain >3: 15 cm), land on both feet, stick 2 s: hips back, knees over the 2nd toe, never inside. Quiet feet. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=drop+landing+technique"},{"t":"ex","id":"D1-45","n":"10","name":"Single-Leg Hop & Stick, forward — 60 cm | pain>3: 40 cm","unit":"reps/side","rest":"30 s","tempo":"stick","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"3×4","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Landing","focus":"PLY · Single-Leg Landing","note":"Hop forward, land on the same leg, stick 2 s. A silent, stable landing matters more than distance. Hop forward 60 cm (pain >3: 40 cm) on one leg, stick 2 s, knee over the 2nd toe. Weaker leg first. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=single+leg+hop+and+stick"},{"t":"ex","id":"D1-46","n":"11","name":"Single-Leg Hop Matrix — 4 squares, 30 cm | pain>3: 20 cm","unit":"s/side","rest":"30 s","tempo":"stick","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"2×20","kg":"BW"},{"s":"2×30","kg":"BW"},{"s":"2×20","kg":"BW"}],"kind":"Landing","focus":"PLY · Multi-Directional Landing","note":"Tape a cross on the floor. On one leg, hop forward, back, out and in across the lines, stick each landing 1 s, knee over the 2nd toe. Standard size 30 cm; pain above 3/10: 20 cm. Landing prep for the jumps, 20-30 s per leg. Weaker leg first. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=single+leg+hop+matrix"},{"t":"ex","id":"D1-47","n":"12","name":"Lateral Skater Bound — 1.0 m | pain>3: 0.6 m","unit":"reps/side","rest":"30 s","tempo":"stick","w":[{"s":"3×4","kg":"BW"},{"s":"3×4","kg":"BW"},{"s":"3×5","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Lateral Plane","focus":"PLY · Frontal-Plane Landing","note":"Push off one leg, land on the other and stick 2 s, knee over the foot. The ski-edge push, loaded. Bound 1.0 m sideways (pain >3: 0.6 m), stick 2 s on the outside leg. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=lateral+skater+bound"},{"t":"ex","id":"D1-48","n":"13","name":"Skater Bound, 3 continuous + stick — 1.0 m | pain>3: 0.6 m","unit":"reps/side","rest":"45 s","tempo":"X","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"3×3","kg":"BW"},{"s":"2×2","kg":"BW"}],"kind":"Lateral Plane","focus":"PLY · Reactive Landing","note":"Three quick bounds side to side, stick the fourth. Short ground contacts, same knee control. Three continuous 1.0 m bounds (pain >3: 0.6 m), then stick the last landing 2 s. Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://www.youtube.com/results?search_query=continuous+skater+bounds"},{"t":"ex","id":"D1-49","n":"14","name":"Box Jump — 40 cm | pain>3: 25 cm","unit":"reps","rest":"30 s","tempo":"X","w":[{"s":"2×5","kg":"BW" 1 rep. Box 35 cm (pain >3: 25 cm). Height rule: pain 0-3/10 (during and the next morning) = standard; above 3 = the low version; above 5 = skip the jumps today.","video":"https://mtntactical.com/exercises/touch-jump-touch-box/"},{"t":"sec","text":"INJURY-PROOFING — hamstrings + adductors. Nordics on D1 and D2, standing single-leg curl on D1, slider curl on D2, lying leg curl on D3 and D4: six hamstring hits a week."},{"t":"ex","id":"D1-57","n":"20","name":"Nordic Hamstring Curl (hand-assisted)","unit":"reps","rest":"90 s","tempo":"5-0-X","w":[{"s":"2×4","kg":"BW"},{"s":"3×4","kg":"BW"},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Isolation","focus":"EC · Hamstring Eccentric Resilience","note":"Lower under control, catch with the hands. Volume starts low because first-week soreness is severe.","video":"https://www.youtube.com/results?search_query=nordic+hamstring+curl+progression"},{"t":"ex","id":"D1-58","n":"21","name":"Nordic Hamstring Curl","unit":"reps","rest":"90 s","tempo":"5-0-X","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"3×5","kg":"BW"},{"s":"3×6","kg":"BW"},{"s":"2×3","kg":"BW"}],"kind":"Isolation","focus":"EC · Hamstring Eccentric Resilience","note":"Less hand help each week; lower as slowly as you can. End the set when the first half is no longer controlled.","video":"https://www.youtube.com/results?search_query=nordic+hamstring+curl+progression"},{"t":"ex","id":"D1-59","n":"22","name":"Copenhagen Adduction — short lever (not used, long lever only)","unit":"reps/side","rest":"60 s","tempo":"2-0-2","w":[{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null},{"s":"—","kg":null}],"kind":"Isolation","focus":"EC · Adductor Resilience","note":"Side plank, top KNEE on a bench, lift the bottom leg to meet it, lower slowly. Cut groin problems 41% in an RCT.","video":"https://www.youtube.com/results?search_query=copenhagen+adduction"},{"t":"ex","id":"D1-60","n":"23","name":"Copenhagen Adduction — long lever"," const SKEY='ski5week.v1';
let S={week:null,sess:'D1',done:{},kg:{},pain:{},tjt:{t1:'',t2:''},open:{},extra:{},notes:{},ov:{},swap:{},hist:{},fin:{},ver:null,morn:{},dur:{},t0:{},th:{}};
function load(){try{const j=JSON.parse(localStorage.getItem(SKEY)||'null');if(j&&typeof j==='object')S=Object.assign(S,j)}catch(e){}}
function save(){try{snap(S.week,S.sess)}catch(e){}try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
load();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OFF=s=>s==null||s===''||s==='—'||s==='-';
function defaultWeek(){const t=new Date().toISOString().slice(0,10);let w=0;PLAN.weeks.forEach((x,i)=>{if(x.date&&x.date<=t)w=i});return w}
if(S.week==null||S.week>=PLAN.weeks.length)S.week=defaultWeek();
try{if(S.ver!==PLAN.version){const raw=localStorage.getItem(SKEY);if(raw)localStorage.setItem('ski5week.bak.'+(S.ver||'pre'),raw);S.ver=PLAN.version;localStorage.setItem(SKEY,JSON.stringify(S))}}catch(e){}
const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
function curSess(){return PLAN.sessions.find(s=>s.id===S.sess)||PLAN.sessions[0]}
// ---- helpers
function parseName(name){
  let low=null,base=name,std=null;const i=name.indexOf('pain>3:');
  if(i>=0){low=name.slice(i+7).trim();base=name.slice(0,i).replace(/[\s|—-]+$/,'').trim()}
  const k=base.lastIndexOf(' — ');
  if(low!==null&&k>=0){std=base.slice(k+3).trim();base=base.slice(0,k).trim()}

   <label class="field"><span>kg</span><input id="axKg" inputmode="decimal" placeholder="optional"></label></div>
   <div style="margin-top:12px"><button class="btn" id="axOk">Add</button><button class="btn alt" id="axNo">Cancel</button></div>`;
  const draw=()=>{const q=$('axName').value.trim().toLowerCase();const m=lib.filter(t=>!q||t.toLowerCase().includes(q)).slice(0,40);
    $('axLib').innerHTML=m.map(t=>`<button data-t="${esc(t)}">${esc(t)}</button>`).join('')||'<div class="small muted" style="padding:9px 10px">No match: it will be added as typed.</div>';
    $('axLib').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('axName').value=b.dataset.t;draw()})};
  $('axName').oninput=draw;draw();
  $('axNo').onclick=()=>closeSheet('sheetAdd');
  $('axOk').onclick=()=>{const name=$('axName').value.trim();if(!name){$('axName').focus();return}
    const sets=Math.max(1,Math.min(12,parseInt($('axSets').value)||1));
    (S.extra[xk]=S.extra[xk]||[]).push({name,sets,reps:$('axReps').value.trim(),kg:$('axKg').value.trim(),done:[]});
    save();closeSheet('sheetAdd');renderMainKeepScroll()};
  openSheet('sheetAdd');
}
// ---- overview + settings
function openSheet(id){$(id).classList.add('on')}
function closeSheet(id){$(id).classList.remove('on')}
['sheetWeek','sheetSet','sheetAdd','sheetProg'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.id===id)closeSheet(id)}));
$('btnWeek').onclick=()=>{
  const w=PLAN.weeks[S.week];
  $('weekPanel').innerHTML=`<h2 style="margin:0 0 8px">${esc(w.label)} · ${esc(w.phase||'')} · week of ${fmtDate(w.date)}</h2>
  <div class="card wkcard"><dl><dt>TJT EMOM</dt><dd>${esc(w.emom)} min (D1 / D3)</dd><dt>Landings</dt><dd>${esc(w.landing)}</dd><dt>Blasters (D2)</dt><dd>${esc(w.blasters)}</dd><dt>Chassis grind</dt><dd>${esc(w.chassis)}</dd><dt>D4 circuit</dt><dd>${esc(w.circuit)}</dd></dl></div>
  <div class="card"><h2>Saved days</h2>${histHtml()}</div>
  <div class="card"><h2>Pain log</h2>${PLAN.weeks.map((x,wi)=>`<div class="small"><b>${x.label}</b> ${PLAN.sessions.map(s=>{const v=S.pain[painKey(wi,s.id)];return s.id+': '+(v==null?'–':v)}).join(' · ')}</div>`).join('')}</div>
  <button class="btn" id="closeWeek">Close</button>`;
  $('closeWeek').onclick=()=>closeSheet('sheetWeek');openSheet('sheetWeek');
};
$('btnSet').onclick=()=>{
  $('setPanel').innerHTML=`<h2 style="margin:0 0 6px">Settings</h2>
  <div class="card"><h2>Backup your log</h2><div class="small muted">Your sets, weights and pain log live on this phone only. Copy the text below and keep it, or paste a saved copy to restore it.</div>
  <textarea id="bk" spellcheck="false"></textarea>
  <button class="btn" id="bkExp">Copy text</button><button class="btn" id="bkFile">Save backup file</button><button class="btn" id="bkCsv">Save log for Excel (CSV)</button><button class="btn alt" id="bkImp">Import</button><div class="small muted" id="bkMsg" style="margin-top:6px"></div></div>
  <div class="card"><h2>Theme</h2><button class="btn alt" data-th="">System</button><button class="btn alt" data-th="light">Light</button><button class="btn alt" data-th="dark">Dark</button></div>
  <div class="card"><h2>Install on your phone</h2><div class="small muted">iPhone: Safari, Share, Add to Home Screen. Android: Chrome menu, Install app.</div></div>
  <div class="card"><h2>Start over</h2><div class="small muted">Clears every tick, weight, pain score and test result.</div><button class="btn bad" id="wipe">Clear everything</button></div>
  <button class="btn" id="closeSet">Close</button>`;
  $('closeSet').onclick=()=>closeSheet('sheetSet');
  $('bkExp').onclick=()=>{const t=JSON.stringify({done:S.done,kg:S.kg,pain:S.pain,tjt:S.tjt,extra:S.extra,notes:S.notes,ov:S.ov,swap:S.swap,hist:S.hist,fin:S.fin,morn:S.morn,dur:S.dur,th:S.th});$('bk').value=t;$('bk').select();
    let ok=false;try{navigator.clipboard.writeText(t).then(()=>{$('bkMsg').textContent='Copied.'},()=>{});ok=true}catch(e){}
    $('bkMsg').textContent=ok?'Copied to the clipboard. If not, select the text and copy it.':'Select the text and copy it.'};
  const dl=(name,txt,type)=>{try{const u=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);$('bkMsg').textContent='Saved as '+name+' (check your Downloads / Files app).'}catch(e){$('bkMsg').textContent='Could not save a file here. Use Copy text instead.'}};
  $('bkFile').onclick=()=>dl('ski5week-backup-'+todayStr()+'.json',JSON.stringify({done:S.done,kg:S.kg,pain:S.pain,tjt:S.tjt,extra:S.extra,notes:S.notes,ov:S.ov,swap:S.swap,hist:S.hist,fin:S.fin,morn:S.morn,dur:S.dur,th:S.th}),'application/json');
  $('bkCsv').onclick=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Week','Day','Exercise','Planned','Sets done','Sets planned','kg','Box height cm']];const cs=[];
    PLAN.weeks.forEach((w,wi)=>PLAN.sessions.forEach(se=>{const k=wi+'|'+se.id;visibleEx(se,wi).forEach(it=>{if(it.t!=='ex')return;const key=wi+'|'+it.id,n=nSets(it,wi),a=S.done[key]||[];let c=0;for(let i=0;i<n;i++)if(a[i])c++;const sw=S.swap[key];
      if(c||S.kg[key]||sw||S.th[key])rows.push([w.label,se.id,(sw?sw.name+' (instead of '+parseName(it.name).title+')':parseName(it.name).title),specText(it,wi).main,c,n,S.kg[key]||'',S.th[key]||''])});
      (S.extra[k]||[]).forEach(x=>rows.push([w.label,se.id,x.name+' (added)',x.sets+'×'+(x.reps||''),(x.done||[]).filter(Boolean).length,x.sets,x.kg||'','']));
      if(S.pain[k]!=null||S.morn[k]!=null||durNow(k)||S.notes[k])cs.push([w.label,se.id,S.pain[k]==null?'':S.pain[k],(S.morn[k]==null||S.morn[k]<0)?'':S.morn[k],durNow(k)?Math.round(durNow(k)/60):'',S.notes[k]||''])}));
    let t='Sets log\n'+rows.map(r=>r.map(q).join(',')).join('\n')+'\n\nSessions\n'+['Week','Day','Pain during','Pain next morning','Minutes','Notes'].map(q).join(',')+'\n'+cs.map(r=>r.map(q).join(',')).join('\n')+'\n\nTJT test\n'+q('Test 1 reps')+','+q(S.tjt.t1)+'\n'+q('Test 2 reps')+','+q(S.tjt.t2);
    dl('ski5week-log-'+todayStr()+'.csv','\ufeff'+t,'text/csv')};
  $('bkImp').onclick=()=>{try{const j=JSON.parse($('bk').value);if(!j||typeof j!=='object')throw 0;S.done=j.done||{};S.kg=j.kg||{};S.pain=j.pain||{};S.tjt=j.tjt||{t1:'',t2:''};S.extra=j.extra||{};S.notes=j.notes||{};S.ov=j.ov||{};S.swap=j.swap||{};S.hist=j.hist||{};S.fin=j.fin||{};S.morn=j.morn||{};S.dur=j.dur||{};S.th=j.th||{};S.t0={};save();renderAll();$('bkMsg').textContent='Restored.'}catch(e){$('bkMsg').textContent='That text is not a valid backup.'}};
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{const v=b.dataset.th;if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('ski5week.theme',v)}catch(e){}});
  let c=0;$('wipe').onclick=()=>{c++;if(c<2){$('wipe').textContent='Tap again to confirm';return}S.done={};S.kg={};S.pain={};S.tjt={t1:'',t2:''};S.open={};S.extra={};S.notes={};S.ov={};S.swap={};S.hist={};S.fin={};S.morn={};S.dur={};S.t0={};S.th={};save();renderAll();closeSheet('sheetSet')};
  openSheet('sheetSet');
};
try{const th=localStorage.getItem('ski5week.theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
renderAll();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
